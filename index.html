        if (!b) return;
        if (b.dataset.persona) {
          const id = b.dataset.persona;
          const i = s.team.indexOf(id);
          if (i >= 0) {
            if (s.team.length === 1) return;
            s.team.splice(i, 1);
          } else {
            if (s.team.length >= 3) { $('#setupWarn').textContent = '⚠️ ' + t('setup.full'); Sound.mistake(); return; }
            s.team.push(id);
          }
        } else if (b.dataset.mode) s.variant = b.dataset.mode;
        else if (b.dataset.diff) s.difficulty = b.dataset.diff;
        else if (b.dataset.house) s[b.dataset.house] = !s[b.dataset.house];
        else if (b.id === 'startBtn') { this.startGame(); return; }
        else return;
        Sound.click();
        Store.save();
        const y = global.scrollY;
        this.renderSetup();
        global.scrollTo(0, y);
      };
    },

    /* ---------- teach in 60 seconds (onboarding) ---------- */
    renderTeach() {
      this.stopTeach();
      $('#screen-teach').innerHTML = `
        <div class="wrap">
          <h2>⏱ ${t('teach.title')}</h2>
          <p class="sub">${t('teach.sub')}</p>
          <div class="teach">
            <div class="teach-stage" id="teachStage"></div>
            <div class="teach-text">
              <div class="timer"><div class="ring" id="teachRing" style="--p:100"><span id="teachSec">60</span></div><div class="dots" id="teachDots">${'<i></i>'.repeat(6)}</div></div>
              <div class="teach-step" id="teachStep" aria-live="polite"></div>
              <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn small ghost" id="tPrev">‹ ${t('teach.prev')}</button>
                <button class="btn small ghost" id="tPause">⏸ ${t('teach.pause')}</button>
                <button class="btn small ghost" id="tNext">${t('teach.next')} ›</button>
                <button class="btn small ghost" id="tReplay">↺ ${t('teach.replay')}</button>
                <button class="btn small hot" data-nav="setup">▶ ${t('teach.go')}</button>
              </div>
              <div class="tip"><b>🎤 ${t('teach.pitch.t')}</b>${t('teach.pitch.b')}</div>
              <div class="tip"><b>✋ ${t('teach.ritual.t')}</b>${t('teach.ritual.b')}</div>
            </div>
          </div>
        </div>`;
      this.teach = { step: -1, elapsed: 0, paused: false, last: performance.now(), timers: [] };
      $('#tPrev').onclick = () => this.teachGo(Math.max(0, this.teach.step - 1));
      $('#tNext').onclick = () => this.teachGo(Math.min(5, this.teach.step + 1));
      $('#tReplay').onclick = () => this.teachGo(0);
      $('#tPause').onclick = () => {
        this.teach.paused = !this.teach.paused;
        $('#tPause').textContent = this.teach.paused ? '▶ ' + t('teach.resume') : '⏸ ' + t('teach.pause');
      };
      this.teachGo(0);
      this.teach.iv = setInterval(() => {
        const now = performance.now();
        const dt = now - this.teach.last;
        this.teach.last = now;
        if (this.teach.paused) return;
        this.teach.elapsed = Math.min(60000, this.teach.elapsed + dt);
        const left = Math.ceil((60000 - this.teach.elapsed) / 1000);
        $('#teachSec').textContent = left;
        $('#teachRing').style.setProperty('--p', ((60000 - this.teach.elapsed) / 600).toFixed(1));
        const step = Math.min(5, Math.floor(this.teach.elapsed / 10000));
        if (step !== this.teach.step) this.teachGo(step, true);
      }, 100);
    },

    stopTeach() {
      if (!this.teach) return;
      clearInterval(this.teach.iv);
      this.teach.timers.forEach(clearTimeout);
      this.teach = null;
    },

    teachGo(step, auto) {
      const T = this.teach;
      if (!T) return;
      T.step = step;
      if (!auto) T.elapsed = step * 10000;
      T.timers.forEach(clearTimeout);
      T.timers = [];
      $('#teachStep').innerHTML = `<span class="n">${step + 1}/6</span>${t('teach.' + (step + 1))}`;
      $$('#teachDots i').forEach((d, i) => d.classList.toggle('on', i <= step));
      this.teachScene(step);
    },

    teachScene(step) {
      const stage = $('#teachStage');
      stage.innerHTML = '<div class="stage-scene"></div><div class="stage-caption"></div>';
      const sc = $('.stage-scene', stage);
      const cap = $('.stage-caption', stage);
      const W = stage.clientWidth, H = stage.clientHeight;
      const T = this.teach;
      const later = (ms, fn) => T.timers.push(setTimeout(fn, ms));
      const place = (el, x, y, r) => {
        el.style.left = x - 32 + 'px';
        el.style.top = y - 46 + 'px';
        el.style.transform = `rotate(${r || 0}deg)`;
        sc.appendChild(el);
        return el;
      };
      const moveTo = (el, x, y, r, dur) => {
        const fromL = parseFloat(el.style.left), fromT = parseFloat(el.style.top);
        const tl = x - 32, tt = y - 46;
        el.animate([{ transform: el.style.transform }, { transform: `translate(${tl - fromL}px, ${tt - fromT}px) rotate(${r || 0}deg)` }], { duration: dur || 700, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
      };
      const cx = W / 2, cy = H / 2 - 10;
      const seats = [[W * 0.18, H * 0.3, 'Elif'], [W * 0.82, H * 0.3, 'Murat'], [W * 0.5, H * 0.82, t('msg.you')]];
      const label = (x, y, text) => {
        const d = document.createElement('div');
        d.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-weight:800;color:#a8a4d8;font-size:13px`;
        d.textContent = text;
        sc.appendChild(d);
        return d;
      };
      const big = (x, y, text, size) => {
        const d = document.createElement('div');
        d.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-size:${size || 56}px;transition:all .5s`;
        d.textContent = text;
        sc.appendChild(d);
        return d;
      };
      if (step === 0) {
        const vals = [23, 81, 47];
        seats.forEach(([x, y, n], i) => {
          label(x, y + (i === 2 ? -62 : 62), n);
          const c = place(cardEl('', null, { back: true }), cx, cy, 0);
          later(300 + i * 450, () => { moveTo(c, x, y, (i - 1) * 8, 600); Sound.deal(); });
          if (i === 2) later(2200, () => { c.classList.remove('back'); c.querySelector('.num').textContent = vals[i]; c.querySelectorAll('.c1,.c2').forEach((e) => { e.textContent = vals[i]; }); c.dataset.v = vals[i]; c.classList.add('shine'); });
        });
        cap.textContent = '1 · 2 · 3 … 12';
      } else if (step === 1) {
        const vals = [[12, 0], [47, 2], [83, 1]];
        const cards = seats.map(([x, y, n], i) => { label(x, y + (i === 2 ? -62 : 62), n); return place(cardEl([12, 83, 47][i], 'up'), x, y, 0); });
        const slot = place(cardEl('', null, { back: false }), cx, cy, 0);
        slot.style.opacity = '0.15';
        vals.forEach(([v, si], k) => later(900 + k * 1500, () => { moveTo(cards[si], cx, cy, k * 6 - 6, 650); Sound.card(v, 'up'); }));
        cap.textContent = '12 → 47 → 83';
      } else if (step === 2) {
        const pile = place(cardEl(12, 'up'), W * 0.28, cy, -4);
        const mine = place(cardEl(47, 'up'), W * 0.72, cy, 4);
        const shh = big(cx, H * 0.18, '🤫', 54);
        const cnt = big(cx, cy, '12', 40);
        cnt.style.fontWeight = '900';
        cnt.style.color = '#5ef2ff';
        let v = 12;
        const tick = () => {
          v++;
          cnt.textContent = v;
          if (v % 4 === 0) Sound.heartbeat(0.2);
          if (v < 47) later(170, tick);
          else later(300, () => { moveTo(mine, W * 0.28, cy, 3, 600); Sound.card(47, 'up'); cnt.textContent = '✓'; });
        };
        later(800, tick);
        void pile; void shh;
        cap.textContent = '47 − 12 = 35 …';
      } else if (step === 3) {
        place(cardEl(12, 'up'), cx, cy, -4);
        const elif = place(cardEl(30, 'up'), W * 0.18, H * 0.3, 0);
        label(W * 0.18, H * 0.3 + 62, 'Elif');
        const mine = place(cardEl(47, 'up'), W * 0.5, H * 0.82, 0);
        const heart = big(W * 0.85, H * 0.16, '❤️', 40);
        later(900, () => { moveTo(mine, cx, cy, 5, 500); Sound.card(47, 'up'); });
        later(1500, () => {
          Sound.mistake();
          stage.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], { duration: 400 });
          elif.classList.add('bad');
          heart.style.transform = 'translate(-50%,-30%) rotate(25deg)';
          heart.style.filter = 'grayscale(1)';
          heart.style.opacity = '.35';
        });
        later(2600, () => moveTo(elif, W * 0.85, H * 0.75, 12, 700));
        cap.textContent = '30 < 47 → −1 ❤️';
      } else if (step === 4) {
        const vals = [18, 35, 52];
        const cs = seats.map(([x, y, n], i) => { label(x, y + (i === 2 ? -62 : 62), n); return place(cardEl('', null, { back: true }), x, y, 0); });
        const s = document.createElement('div');
        s.className = 'shuriken-fly';
        s.style.position = 'absolute';
        s.style.left = cx - 32 + 'px';
        s.style.top = cy - 32 + 'px';
        sc.appendChild(s);
        s.animate([{ transform: 'scale(0) rotate(0)' }, { transform: 'scale(1.2) rotate(720deg)' }, { transform: 'scale(0) rotate(1080deg)' }], { duration: 1800, fill: 'forwards' });
        later(200, () => Sound.star());
        later(1600, () => cs.forEach((c, i) => {
          c.classList.remove('back');
          c.querySelector('.num').textContent = vals[i];
          c.classList.add('starred');
        }));
        later(3200, () => cs.forEach((c, i) => moveTo(c, W * 0.85 + i * 14, H * 0.78, 8, 700)));
        cap.textContent = '⭐ → 18 · 35 · 52';
      } else {
        const n = 12;
        for (let i = 1; i <= n; i++) {
          const x = W * 0.1 + ((W * 0.8) / (n - 1)) * (i - 1);
          const y = H * 0.75 - (i - 1) * (H * 0.045);
          const d = big(x, y, '', 12);
          d.style.cssText += ';width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.3)';
          const r = Mind.LEVEL_REWARDS[i];
          if (r) big(x, y + 26, r === 'star' ? '⭐' : '❤️', 16);
          later(400 + i * 380, () => { d.style.background = '#5ef2ff'; d.style.boxShadow = '0 0 14px #5ef2ff'; Sound.tone({ freq: 300 + i * 60, dur: 0.2, gain: 0.05 }); });
        }
        big(cx, H * 0.18, '🏆', 50);
        cap.textContent = '2p: 12 · 3p: 10 · 4p: 8';
      }
    },

            ${rows ? `<div style="margin-top:12px"><button class="btn small ghost" id="clearLog">🗑 ${t('journal.clear')}</button></div>` : ''}
          </div>
          <div class="panel section">

    },

    /* ---------- game lifecycle ---------- */
    startGame(opts) {
      const demo = !!(opts && opts.demo);
      if (this.engine) this.teardownGame();
      const s = this.settings;
      const team = demo ? ['elif', 'murat', 'ece'] : s.team.slice(0, 3);
      const players = [];
      const meta = { players: {}, you: null };
      if (!demo) {
        players.push({ id: 'you', human: true });
        meta.players.you = { human: true, name: t('msg.you'), look: YOU };
        meta.you = meta.players.you;
      }
      for (const id of team) {
        const p = PERSONAS.find((x) => x.id === id);
        players.push({ id, name: p.name, sigma: p.sigma, pace: p.pace });
        meta.players[id] = { name: p.name, look: p, role: t('persona.' + id + '.t') };
      }
      const engine = new Mind.MindEngine({
        players,
        variant: demo ? 'classic' : s.variant,
        difficulty: demo ? 'easy' : s.difficulty,
        adapt: s.adapt,
      });
      this.engine = engine;
      this.demo = demo;
      this.ended = false;
      this.gameStart = Date.now();
      this.screen = 'game';
      this.closeModal();
      $$('.screen').forEach((x) => x.classList.toggle('active', x.id === 'screen-game'));
      $$('.nav button').forEach((b) => b.classList.remove('active'));
      Sound.ensure();
      UI.mount(engine, meta, s, demo);
      engine.on('levelStart', (d) => this.onLevelStart(d));
      engine.on('levelComplete', (d) => this.onLevelComplete(d));
      engine.on('victory', () => this.onEnd(true));
      engine.on('gameOver', () => this.onEnd(false));
      requestAnimationFrame(() => engine.start(performance.now()));
    },

    teardownGame() {
      UI.unmount();
      this.engine = null;
      this.closeModal();
    },

    quitGame() {
      const e = this.engine;
      if (!e) return true;
      const inProgress = !this.ended && !this.demo && e.level >= 1;
      if (inProgress) {
        if (!confirm(t('confirm.quit'))) return false;
        this.logGame(false);
      }
      this.teardownGame();
      return true;
    },

    now() { return performance.now(); },

    humanPlay(pileId) {
      if (!this.engine || this.demo) return;
      Sound.ensure();
      this.engine.humanPlay(pileId, this.now());
    },

    bindGameControls() {
      $('#handBtn').addEventListener('click', () => { if (this.engine) { Sound.ensure(); this.engine.placeHand('you', this.now()); } });
      $('#starBtn').addEventListener('click', () => { if (this.engine) this.engine.proposeStar('you', this.now()); });
      $('#refocusBtn').addEventListener('click', () => { if (this.engine) this.engine.callRefocus('you', this.now()); });
      $('#voteYes').addEventListener('click', () => { if (this.engine) this.engine.voteStar(true, this.now()); });
      $('#voteNo').addEventListener('click', () => { if (this.engine) this.engine.voteStar(false, this.now()); });
      $('#pauseBtn').addEventListener('click', () => this.pause());
      $('#demoCta').addEventListener('click', () => { this.teardownGame(); this.go('setup'); });
      $('#demoClose').addEventListener('click', () => { this.teardownGame(); this.go('home'); });
    },

    onKey(ev) {
      if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
      const k = ev.key;
      if (!$('#overlay').hidden) {
        if (k === 'Enter') { const p = $('#modal [data-primary]'); if (p) { ev.preventDefault(); p.click(); } }
        if (k === 'Escape' && this.engine && this.engine.phase === 'paused') { ev.preventDefault(); this.resume(); }
        return;
      }
      if (k === 'm' || k === 'M') { $('#soundBtn').click(); return; }
      if (this.screen !== 'game' || !this.engine || this.demo) return;
      const e = this.engine;
      const now = this.now();
      if (k === ' ' || k === 'Spacebar') {
        ev.preventDefault();
        Sound.ensure();
        if (e.phase === 'sync') e.placeHand('you', now);
        else if (e.phase === 'playing' && e.piles.length === 1) e.humanPlay(null, now);
      } else if (k === 'ArrowUp' && e.pile('up')) { ev.preventDefault(); e.humanPlay('up', now); }
      else if (k === 'ArrowDown' && e.pile('down')) { ev.preventDefault(); e.humanPlay('down', now); }
      else if (k === 's' || k === 'S') e.proposeStar('you', now);
      else if (k === 'r' || k === 'R') e.callRefocus('you', now);
      else if (k === 'y' || k === 'Y') e.voteStar(true, now);
      else if (k === 'n' || k === 'N') e.voteStar(false, now);
      else if (k === 'Escape' || k === 'p' || k === 'P') this.pause();
    },

    refreshGameLang() {
      if (!this.engine) return;
      UI.renderHud();
      UI.renderPiles();
      UI.renderHand(false);
      for (const id in UI.seatEls) {
        const role = UI.seatEls[id].querySelector('.role');
        if (role) role.textContent = t('persona.' + id + '.t');
      }
      $('#youChip span:last-child') && ($('#youChip span:last-child').textContent = t('msg.you'));
    },

    onLevelStart(d) {
      if (d.level >= 6) {
        this.unlockBadge('lvl6');
        if (this.engine.players.some((p) => p.id === 'ece')) this.unlockBadge('kid');
      }
    },

    onLevelComplete(d) {
      const e = this.engine;
      this.levelBadges(d.level, d.flawless);
      if (this.demo) {
        if (d.level >= 4) setTimeout(() => this.showDemoEnd(), 1800);
        else setTimeout(() => { if (this.engine === e) e.nextLevel(this.now()); }, 2600);
        return;
      }
      setTimeout(() => {
        if (this.engine !== e || e.phase !== 'levelComplete') return;
        const next = d.level + 1;
        let reward = '';
        if (d.reward) {
          reward = d.applied
            ? `<div class="reward">${d.reward === 'life' ? '❤️ ' + t('lc.reward.life') : '<span class="shuriken-ico"></span> ' + t('lc.reward.star')}</div>`
            : `<p class="muted">${t('lc.reward.capped')}</p>`;
          if (d.applied) Sound.reward();
        }
        this.openModal(`
          <div class="big-ico">${d.flawless ? '💎' : '🎉'}</div>
          <h2>${t('lc.title', { n: d.level })}</h2>
          ${d.flawless ? `<div class="tag gold" style="margin:6px 0">✨ ${t('lc.flawless')}</div>` : ''}
          <div>${reward}</div>
          <p class="muted">❤️ ${e.lives} · ⭐ ${e.stars}</p>
          <p class="muted">${t('lc.next', { n: next })}</p>
          <div class="lc-cards">${Array.from({ length: Math.min(next, 12) }, (_, i) => `<div class="card back" style="animation-delay:${i * 0.06}s"><span class="emblem">MIND</span></div>`).join('')}</div>
          <div class="row"><button class="btn big hot" id="nextLvl" data-primary>🃏 ${t('lc.go', { n: next })} <kbd>Enter</kbd></button></div>`);
        $('#nextLvl').onclick = () => { this.closeModal(); e.nextLevel(this.now()); };
      }, 1300);
    },

    levelBadges(level, flawless) {
      const v = this.engine.variantId;
      if (level >= 1) this.unlockBadge('first');
      if (flawless && level >= 4) this.unlockBadge('flawless');
      if (v === 'blind' && level >= 3) this.unlockBadge('blind');
      if (v === 'reverse' && level >= 5) this.unlockBadge('reverse');
      if (v === 'dual' && level >= 4) this.unlockBadge('extreme');
    },

    unlockBadge(id) {
      if (this.demo) return false;
      if (!Store.unlock(id)) return false;
      const b = BADGES.find((x) => x.id === id);
      this.toast(`${b.icon} ${t('badge.unlocked', { name: t('badge.' + id + '.t') })}`);
      Sound.reward();
      return true;
    },

    logGame(won) {
      const e = this.engine;
      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        date: new Date().toISOString(),
        team: e.players.filter((p) => !p.human).map((p) => p.id),
        players: e.players.map((p) => p.id),
        variant: e.variantId,
        difficulty: e.difficultyId,
        level: e.level,
        maxLevel: e.maxLevel,
        won,
        lives: e.lives,
        starsUsed: e.stats.starsUsed,
        mistakes: e.stats.mistakes,
        perfectSyncs: e.stats.perfectSyncs,
        flawless: e.stats.flawlessLevels,
        seconds: Math.round((Date.now() - this.gameStart) / 1000),
        rating: null,
        recommend: null,
        tags: [],
      };
      Store.addGame(entry);
      if (Store.data.log.length >= 10) this.unlockBadge('regular');
      return entry;
    },

    onEnd(won) {
      const e = this.engine;
      this.ended = true;
      if (this.demo) { setTimeout(() => this.showDemoEnd(), 2000); return; }
      if (won) {
        this.levelBadges(e.level, e.levelMistakes === 0 && !e.levelStarUsed);
        if (e.players.length === 2) this.unlockBadge('club12');
        if (e.players.length === 4) this.unlockBadge('full');
        if (e.stats.starsUsed === 0) this.unlockBadge('nostar');
        Sound.victory();
        FX.confetti(4);
      } else {
        Sound.gameOver();
        UI.allMoods('oops', 3000);
      }
      const entry = this.logGame(won);
      setTimeout(() => { if (this.engine === e) this.showEnd(won, entry); }, won ? 1800 : 1500);
    },

    nextChallenge() {
      const id = CHALLENGE_ORDER.find((x) => !Store.data.badges[x]);
      if (!id) return '';
      const b = BADGES.find((x) => x.id === id);
      return `<div class="tip" style="margin-top:14px"><b>🎯 ${t('end.challenge')}</b>${b.icon} <b style="display:inline;color:inherit">${t('badge.' + id + '.t')}</b>: ${t('badge.' + id + '.b')}</div>`;
    },

    showEnd(won, entry) {
      const e = this.engine;
      const title = won ? t('win.title') : t('go.title', { n: e.level });
      const sub = won ? t('win.sub', { max: e.maxLevel }) : t('go.sub', { c: e.level - 1, max: e.maxLevel });
      this.openModal(`
        <div class="big-ico">${won ? '🏆' : '🧠'}</div>
        <h2>${title}</h2>
        <p class="muted">${sub}</p>
        <p class="muted">⚡ ${t('end.stats', { syncs: e.stats.perfectSyncs, mistakes: e.stats.mistakes, stars: e.stats.starsUsed })}</p>
        <div class="endgrid">
          <div>
            <h3>📸 ${t('share.title')}</h3>
            <canvas class="share" id="shareCanvas" width="1080" height="1350"></canvas>
            <div class="row" style="margin-top:10px">
              <button class="btn small" id="shareDl">⬇ ${t('share.download')}</button>
              <button class="btn small ghost" id="shareCopy">📋 ${t('share.copy')}</button>
              ${navigator.share ? `<button class="btn small ghost" id="shareNative">↗ ${t('share.native')}</button>` : ''}
            </div>
          </div>
          <div>
            <h3>${t('review.q')}</h3>
            <div class="rating" id="rating">${['😫', '😕', '😐', '🙂', '😍'].map((x, i) => `<button data-r="${i + 1}" aria-label="${i + 1}/5">${x}</button>`).join('')}</div>
            <h3 style="margin-top:14px">${t('review.rec')}</h3>
            <div class="seg" id="recSeg"><button data-rec="1">👍 ${t('review.yes')}</button><button data-rec="0">${t('review.no')}</button></div>
            <h3 style="margin-top:14px">${t('review.tags')}</h3>
            <div class="tags" id="reviewTags">${REVIEW_TAGS.map((k) => `<button class="tag" data-tag="${k}">${t('tag.' + k)}</button>`).join('')}</div>
            <p class="muted" id="reviewSaved" style="min-height:20px"></p>
            ${this.nextChallenge()}
          </div>
        </div>
        <div class="row">
          <button class="btn big hot" id="againBtn" data-primary>↻ ${t('end.again')}</button>
          <button class="btn big ghost" id="tableBtn">🪑 ${t('end.table')}</button>
        </div>`);
      const info = this.shareInfo(won);
      this.drawShareCard($('#shareCanvas'), info);
      const text = t('share.text', { n: won ? e.maxLevel : e.level }) + ' ' + STORE_URL;
      $('#shareDl').onclick = () => {
        $('#shareCanvas').toBlob((blob) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `the-mind-level-${info.level}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        });
      };
      $('#shareCopy').onclick = async () => {
        try { await navigator.clipboard.writeText(text); } catch (err) {
          const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        $('#shareCopy').textContent = '✓ ' + t('share.copied');
      };
      const ns = $('#shareNative');
      if (ns) ns.onclick = () => {
        $('#shareCanvas').toBlob(async (blob) => {
          const file = new File([blob], `the-mind-level-${info.level}.png`, { type: 'image/png' });
          try {
            if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
            else await navigator.share({ text, url: STORE_URL });
          } catch (err) { /* user cancelled */ }
        });
      };
      const saved = () => { $('#reviewSaved').textContent = '✓ ' + t('review.saved'); };
      $('#rating').onclick = (ev) => {
        const b = ev.target.closest('[data-r]');
        if (!b) return;
        const r = Number(b.dataset.r);
        $$('#rating button').forEach((x) => x.classList.toggle('on', Number(x.dataset.r) === r));
        Store.updateGame(entry.id, { rating: r });
        Sound.click();
        saved();
      };
      $('#recSeg').onclick = (ev) => {
        const b = ev.target.closest('[data-rec]');
        if (!b) return;
        $$('#recSeg button').forEach((x) => x.classList.toggle('on', x === b));
        Store.updateGame(entry.id, { recommend: b.dataset.rec === '1' });
        Sound.click();
        saved();
      };
      $('#reviewTags').onclick = (ev) => {
        const b = ev.target.closest('[data-tag]');
        if (!b) return;
        b.classList.toggle('on');
        Store.updateGame(entry.id, { tags: $$('#reviewTags .tag.on').map((x) => x.dataset.tag) });
        Sound.click();
        saved();
      };
      $('#againBtn').onclick = () => this.startGame();
      $('#tableBtn').onclick = () => { this.teardownGame(); this.go('setup'); };
    },

    showDemoEnd() {
      if (!this.demo || !this.engine) return;
      this.openModal(`
        <div class="big-ico">🤫</div>
        <h2>${t('home.hook')}</h2>
        <p class="muted">${t('home.lead')}</p>
        <div class="row">
          <button class="btn big hot" id="demoTry" data-primary>▶ ${t('demo.cta')}</button>
          <button class="btn big ghost" id="demoTeach">⏱ ${t('home.teach')}</button>
        </div>`);
      $('#demoTry').onclick = () => { this.teardownGame(); this.go('setup'); };
      $('#demoTeach').onclick = () => { this.teardownGame(); this.go('teach'); };
    },

    pause() {
      const e = this.engine;
      if (!e || this.demo || !e.pause(this.now())) return;
      this.openModal(`
        <div class="big-ico">⏸</div>
        <h2>${t('pause.title')}</h2>
        <p class="muted">${t('pause.b')}</p>
        <div class="row">
          <button class="btn big hot" id="resumeBtn" data-primary>▶ ${t('pause.resume')}</button>
          <button class="btn big ghost" id="pauseFaq">❓ ${t('pause.rules')}</button>
          <button class="btn big ghost" id="pauseQuit">🚪 ${t('pause.quit')}</button>
        </div>
        <div class="faq" id="pauseFaqBox" style="text-align:left;margin-top:16px" hidden>
          ${[1, 3, 4, 5].map((i) => `<details><summary>${t('faq.' + i + '.q')}</summary><p>${t('faq.' + i + '.a')}</p></details>`).join('')}
        </div>`);
      $('#resumeBtn').onclick = () => this.resume();
      $('#pauseFaq').onclick = () => { $('#pauseFaqBox').hidden = !$('#pauseFaqBox').hidden; };
      $('#pauseQuit').onclick = () => { if (this.quitGame()) this.go('home'); };
    },

    resume() {
      if (!this.engine) return;
      this.closeModal();
      this.engine.resume(this.now());
    },

    openModal(html) {
      $('#modal').innerHTML = html;
      $('#overlay').hidden = false;
      const p = $('#modal [data-primary]') || $('#modal button');
      if (p) setTimeout(() => p.focus({ preventScroll: true }), 50);
    },

    closeModal() {
      $('#overlay').hidden = true;
      $('#modal').innerHTML = '';
    },

    /* ---------- shareable level card (advocacy) ---------- */
    shareInfo(won) {
      const e = this.engine;
      return {
        won,
        level: won ? e.maxLevel : e.level,
        maxLevel: e.maxLevel,
        team: e.players.map((p) => {
          if (p.human) return { name: t('msg.you'), color: YOU.color };
          const m = PERSONAS.find((x) => x.id === p.id);
          return { name: m.name, color: m.color };
        }),
        mode: `${t('mode.' + e.variantId + '.t')} · ${t('diff.' + e.difficultyId + '.t')}`,
        stats: t('end.stats', { syncs: e.stats.perfectSyncs, mistakes: e.stats.mistakes, stars: e.stats.starsUsed }),
        date: new Date().toLocaleDateString(I18N.lang, { day: 'numeric', month: 'long', year: 'numeric' }),
      };
    },

    drawShareCard(cv, info) {
      const c = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      const font = (w, s) => `${w} ${s}px "Avenir Next", Futura, "Segoe UI", system-ui, sans-serif`;
      const g = c.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#20145f');
      g.addColorStop(0.55, '#0d0a2c');
      g.addColorStop(1, '#3d0d47');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
      const rng = Mind.mulberry32(info.level * 97 + info.team.length);
      const nodes = Array.from({ length: 70 }, () => ({ x: rng() * W, y: rng() * H }));
      c.lineWidth = 1.5;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
          if (d < 190) {
            c.strokeStyle = `rgba(94,242,255,${(1 - d / 190) * 0.22})`;
            c.beginPath(); c.moveTo(nodes[i].x, nodes[i].y); c.lineTo(nodes[j].x, nodes[j].y); c.stroke();
          }
        }
      }
      nodes.forEach((n) => { c.fillStyle = 'rgba(177,140,255,.7)'; c.beginPath(); c.arc(n.x, n.y, 3, 0, 7); c.fill(); });
      const rg = c.createRadialGradient(W / 2, 600, 40, W / 2, 600, 520);
      rg.addColorStop(0, 'rgba(94,242,255,.35)');
      rg.addColorStop(1, 'rgba(94,242,255,0)');
      c.fillStyle = rg;
      c.fillRect(0, 0, W, H);

      if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
      const card = (x, y, r, v, color) => {
        c.save();
        c.translate(x, y);
        c.rotate((r * Math.PI) / 180);
        const w = 170, h = 246;
        const cg = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
        cg.addColorStop(0, color[0]);
        cg.addColorStop(1, color[1]);
        c.fillStyle = cg;
        c.shadowColor = 'rgba(0,0,0,.5)';
        c.shadowBlur = 30;
        c.beginPath();
        c.roundRect(-w / 2, -h / 2, w, h, 22);
        c.fill();
        c.shadowBlur = 0;
        c.strokeStyle = 'rgba(255,255,255,.3)';
        c.lineWidth = 2;
        c.stroke();
        c.fillStyle = '#fff';
        c.font = font(900, 84);
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.shadowColor = 'rgba(94,242,255,.9)';
        c.shadowBlur = 20;
        c.fillText(String(v), 0, 4);
        c.restore();
      };
      const blue = ['#4a3df0', '#120e4b'];
      card(150, 560, -16, Math.max(1, info.level * 3 - 2), blue);
      card(930, 560, 14, Math.min(100, info.level * 8 + 1), blue);
      const fit = (text, size, maxW) => {
        c.font = font(900, size);
        const w = c.measureText(text).width;
        if (w > maxW) c.font = font(900, Math.floor((size * maxW) / w));
      };

      c.textAlign = 'center';
      c.textBaseline = 'alphabetic';
      c.fillStyle = '#5ef2ff';
      c.font = font(800, 34);
      c.fillText('T H E   M I N D', W / 2, 110);
      c.fillStyle = 'rgba(236,235,255,.6)';
      c.font = font(600, 26);
      c.fillText('Boardgamecolony', W / 2, 152);

      if (info.won) {
        c.fillStyle = '#ffd166';
        c.font = font(900, 58);
        c.fillText(t('share.won'), W / 2, 330);
        fit(`${info.level}/${info.maxLevel}`, 300, 560);
        const lg = c.createLinearGradient(0, 380, 0, 700);
        lg.addColorStop(0, '#ffffff');
        lg.addColorStop(1, '#ffd166');
        c.fillStyle = lg;
        c.fillText(`${info.level}/${info.maxLevel}`, W / 2, 690);
      } else {
        c.fillStyle = '#ecebff';
        c.font = font(700, 52);
        c.fillText(t('share.big'), W / 2, 300);
        c.fillStyle = '#ff5ea8';
        c.font = font(900, 64);
        c.fillText(t('share.level'), W / 2, 380);
        fit(String(info.level), 360, 560);
        const lg = c.createLinearGradient(0, 420, 0, 740);
        lg.addColorStop(0, '#ffffff');
        lg.addColorStop(1, '#5ef2ff');
        c.fillStyle = lg;
        c.shadowColor = 'rgba(94,242,255,.6)';
        c.shadowBlur = 40;
        c.fillText(String(info.level), W / 2, 720);
        c.shadowBlur = 0;
      }
      c.fillStyle = 'rgba(236,235,255,.85)';
      c.font = font(600, 40);
      c.fillText('🤫 ' + t('share.silent'), W / 2, 810);

      const n = info.team.length;
      const gap = 200;
      info.team.forEach((m, i) => {
        const x = W / 2 + (i - (n - 1) / 2) * gap;
        const y = 940;
        c.fillStyle = m.color;
        c.shadowColor = m.color;
        c.shadowBlur = 30;
        c.beginPath(); c.arc(x, y, 62, 0, Math.PI * 2); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#0b0820';
        c.font = font(900, 60);
        c.textBaseline = 'middle';
        c.fillText(m.name.charAt(0).toUpperCase(), x, y + 4);
        c.textBaseline = 'alphabetic';
        c.fillStyle = '#ecebff';
        c.font = font(700, 30);
        c.fillText(m.name, x, y + 110);
      });
      c.fillStyle = 'rgba(236,235,255,.75)';
      c.font = font(700, 32);
      c.fillText(info.mode, W / 2, 1125);
      c.font = font(600, 28);
      c.fillText(info.stats, W / 2, 1170);
      c.fillStyle = 'rgba(255,255,255,.08)';
      c.fillRect(0, H - 110, W, 110);
      c.fillStyle = '#5ef2ff';
      c.font = font(800, 30);
      c.textAlign = 'left';
      c.fillText('boardgamecolony.com/game/the-mind', 60, H - 45);
      c.textAlign = 'right';
      c.fillStyle = 'rgba(236,235,255,.7)';
      c.font = font(600, 28);
      c.fillText(info.date, W - 60, H - 45);
    },
  };

  global.App = App;
  document.addEventListener('DOMContentLoaded', () => App.init());
})(window);
  </script>
</body>
</html>
