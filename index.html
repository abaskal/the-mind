<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0820" />
  <meta name="description" content="The Mind: play the silent cooperative card game in your browser. Teach it in 60 seconds, sync your hands, and share your level card." />
  <title>The Mind · Boardgamecolony</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />
  <style>
:root {
  --bg0: #07061a;
  --bg1: #130d36;
  --ink: #ecebff;
  --muted: #a8a4d8;
  --line: rgba(255, 255, 255, 0.1);
  --cyan: #5ef2ff;
  --violet: #b18cff;
  --pink: #ff5ea8;
  --gold: #ffd166;
  --red: #ff4d6d;
  --green: #8bff9a;
  --panel: rgba(22, 17, 58, 0.72);
  --panel2: rgba(34, 27, 82, 0.7);
  --cw: 84px;
  --mini: 30px;
  --tension: 0;
  --num-font: "Avenir Next", "Futura", "Segoe UI", ui-rounded, system-ui, sans-serif;
  --radius: 18px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 700px at 50% -10%, #2a1b6e 0%, transparent 60%), radial-gradient(900px 600px at 100% 100%, #3b0f45 0%, transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg0));
  background-attachment: fixed;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--cyan); }
a.btn { color: #fff; text-decoration: none; }
kbd {
  font: 600 11px/1 ui-monospace, Menlo, monospace;
  padding: 3px 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.18);
  margin-left: 4px; opacity: 0.8;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#bg, #fx { position: fixed; inset: 0; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 60; }
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, calc(0.25 + var(--tension) * 0.55)) 100%);
  transition: background 0.6s;
}
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 55; opacity: 0; background: radial-gradient(ellipse at center, rgba(255, 77, 109, 0.05), rgba(255, 77, 109, 0.45)); }
.flash.on { animation: flash 0.9s ease-out; }
.flash.gold { background: radial-gradient(ellipse at center, rgba(255, 209, 102, 0.0), rgba(255, 209, 102, 0.3)); }
.flash.cyan { background: radial-gradient(ellipse at center, rgba(94, 242, 255, 0.0), rgba(94, 242, 255, 0.25)); }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
  background: linear-gradient(180deg, rgba(8, 6, 26, 0.92), rgba(8, 6, 26, 0.55)); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-logo svg { width: 34px; height: 34px; animation: spin 18s linear infinite; }
.brand-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
.brand-text b { font: 800 19px/1 var(--num-font); letter-spacing: 0.5px; }
.brand-text small { color: var(--muted); font-size: 11px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav button:hover, .nav button.active { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
.tools { display: flex; gap: 8px; }
.icon-btn, .pill-btn {
  background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 999px; height: 36px; min-width: 36px; padding: 0 10px; font-weight: 700;
}
.icon-btn:hover, .pill-btn:hover { background: rgba(255, 255, 255, 0.14); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- screens ---------- */
main { position: relative; z-index: 2; }
.screen { display: none; }
.screen.active { display: block; animation: screenIn 0.5s cubic-bezier(.2, .8, .2, 1); }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; backdrop-filter: blur(8px); }
h1, h2, h3 { margin: 0 0 10px; }
h2 { font: 800 26px/1.15 var(--num-font); }
h3 { font-size: 17px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.muted { color: var(--muted); line-height: 1.5; }
.small { font-size: 13px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px;
  padding: 11px 20px; font-weight: 700; background: linear-gradient(135deg, #5a4bff, #8a3cff); box-shadow: 0 8px 24px rgba(90, 75, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s, filter 0.2s;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: grayscale(0.4); }
.btn.big { padding: 15px 28px; font-size: 17px; }
.btn.small { padding: 7px 14px; font-size: 13px; }
.btn.ghost { background: rgba(255, 255, 255, 0.06); box-shadow: none; }
.btn.good { background: linear-gradient(135deg, #18b88a, #19c7d6); box-shadow: 0 8px 24px rgba(25, 199, 214, 0.3); }
.btn.hot { background: linear-gradient(135deg, #ff5ea8, #ff8a5e); box-shadow: 0 8px 24px rgba(255, 94, 168, 0.35); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.tag { display: inline-flex; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(94, 242, 255, 0.1); color: var(--cyan); border: 1px solid rgba(94, 242, 255, 0.3); }
.tag.pink { background: rgba(255, 94, 168, 0.1); color: var(--pink); border-color: rgba(255, 94, 168, 0.3); }
.tag.gold { background: rgba(255, 209, 102, 0.1); color: var(--gold); border-color: rgba(255, 209, 102, 0.3); }
.tag.green { background: rgba(139, 255, 154, 0.1); color: var(--green); border-color: rgba(139, 255, 154, 0.3); }
button.tag { cursor: pointer; }
button.tag.on { background: var(--cyan); color: #06121a; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 30px; align-items: center; min-height: calc(100vh - 140px); }
.kicker { color: var(--cyan); font-weight: 700; letter-spacing: 0.4px; font-size: 13px; text-transform: uppercase; }
.hero h1 {
  font: 900 clamp(56px, 9vw, 112px)/0.92 var(--num-font); letter-spacing: -2px; margin: 10px 0 14px;
  background: linear-gradient(100deg, #fff 10%, var(--cyan) 45%, var(--pink) 85%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 30px rgba(94, 242, 255, 0.25));
}
.hook { font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; margin: 0 0 12px; }
.hook .quiet { opacity: 0.55; letter-spacing: 1px; }
.hook .boom { color: var(--gold); display: inline-block; animation: boom 3.2s ease-in-out infinite; }
@keyframes boom { 0%, 55% { transform: scale(1); text-shadow: none; } 62% { transform: scale(1.18) rotate(-2deg); text-shadow: 0 0 24px rgba(255, 209, 102, 0.8); } 72%, 100% { transform: scale(1); } }
.lead { color: var(--muted); font-size: 17px; line-height: 1.55; max-width: 560px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hero-art { position: relative; height: 440px; perspective: 1000px; }
#heroCards { position: absolute; inset: 0; }
.hero-art .card { position: absolute; left: 50%; top: 50%; --cw: 120px; animation: floatCard 6s ease-in-out infinite; }
@keyframes floatCard {
  0%, 100% { transform: translate(-50%, -50%) translate(var(--x), var(--y)) rotate(var(--r)); }
  50% { transform: translate(-50%, -50%) translate(var(--x), calc(var(--y) - 16px)) rotate(calc(var(--r) + 3deg)); }
}
.hero-art .orbit { position: absolute; inset: 8%; border-radius: 50%; border: 1px dashed rgba(94, 242, 255, 0.25); animation: spin 40s linear infinite; }
.hero-art .orbit.o2 { inset: 22%; border-color: rgba(255, 94, 168, 0.25); animation-duration: 28s; animation-direction: reverse; }
.hero-art .shh { position: absolute; right: 8%; top: 6%; font-size: 46px; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }
.section { margin-top: 26px; }
.why-card { position: relative; overflow: hidden; }
.why-card .ico { font-size: 30px; margin-bottom: 8px; }
.why-card p { color: var(--muted); line-height: 1.5; margin: 0; }
.journey { display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; }
.journey .step { flex: 1 1 150px; position: relative; padding: 14px 14px 14px 46px; min-height: 64px; display: flex; align-items: center; font-weight: 700; font-size: 14px; }
.journey .step .n { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #0b0820; font-weight: 900; }
.journey .step:not(:last-child)::after { content: "›"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 22px; }
.journey .step.aha .n { background: linear-gradient(135deg, var(--gold), var(--pink)); animation: pulseDot 2s infinite; }
@keyframes pulseDot { 50% { box-shadow: 0 0 0 8px rgba(255, 209, 102, 0.0), 0 0 18px rgba(255, 209, 102, 0.8); } }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.kids-note { margin-top: 12px; color: var(--green); font-weight: 600; }
.alts { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.alts li { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
.own { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; background: linear-gradient(135deg, rgba(90, 75, 255, 0.25), rgba(255, 94, 168, 0.18)); }
footer.foot { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0 0; opacity: 0.75; }

/* ---------- cards ---------- */
.card {
  --w: var(--cw); width: var(--w); height: calc(var(--w) * 1.45); border-radius: calc(var(--w) * 0.13); position: relative; flex: 0 0 auto;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0 18%, transparent 19% 27%, rgba(255, 255, 255, 0.06) 28% 30%, transparent 31%), linear-gradient(155deg, #4a3df0, #241d8f 55%, #120e4b);
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25), inset 0 0 0 calc(var(--w) * 0.045) rgba(255, 255, 255, 0.06);
  user-select: none; overflow: hidden; transform-style: preserve-3d;
}
.card::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(var(--w) * 0.09), rgba(94, 242, 255, 0.08) calc(var(--w) * 0.09) calc(var(--w) * 0.1));
  mask: radial-gradient(circle at 50% 50%, #000 0 45%, transparent 70%);
  -webkit-mask: radial-gradient(circle at 50% 50%, #000 0 45%, transparent 70%);
}
.card::after {
  content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.22) 50%, transparent 60%);
  transform: translateX(-60%); transition: transform 0.8s;
}
.card:hover::after, .card.shine::after { transform: translateX(60%); }
.card .num {
  position: absolute; inset: 0; display: grid; place-items: center; font: 900 calc(var(--w) * 0.44) / 1 var(--num-font); letter-spacing: -1px;
  color: #fff; text-shadow: 0 0 calc(var(--w) * 0.12) rgba(94, 242, 255, 0.85), 0 2px 0 rgba(0, 0, 0, 0.35);
}
.card .c1, .card .c2 { position: absolute; font: 800 calc(var(--w) * 0.14) / 1 var(--num-font); color: rgba(255, 255, 255, 0.75); }
.card .c1 { top: calc(var(--w) * 0.08); left: calc(var(--w) * 0.1); }
.card .c2 { bottom: calc(var(--w) * 0.08); right: calc(var(--w) * 0.1); transform: rotate(180deg); }
.card .dir { position: absolute; top: calc(var(--w) * 0.07); right: calc(var(--w) * 0.1); font-size: calc(var(--w) * 0.14); opacity: 0.7; }
.card.down {
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0 18%, transparent 19% 27%, rgba(255, 255, 255, 0.06) 28% 30%, transparent 31%), linear-gradient(155deg, #ff4d6d, #a3143f 55%, #4a0820);
}
.card.down .num { text-shadow: 0 0 calc(var(--w) * 0.12) rgba(255, 170, 120, 0.9), 0 2px 0 rgba(0, 0, 0, 0.35); }
.card.down::before { background: repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(var(--w) * 0.09), rgba(255, 209, 102, 0.1) calc(var(--w) * 0.09) calc(var(--w) * 0.1)); }
.card.back {
  background: radial-gradient(circle at 50% 50%, rgba(94, 242, 255, 0.35) 0 6%, transparent 7%), repeating-radial-gradient(circle at 50% 50%, rgba(177, 140, 255, 0.0) 0 8%, rgba(177, 140, 255, 0.28) 8% 9%), conic-gradient(from 0deg, #1b1550, #2c1170, #1b1550, #0e3a5c, #1b1550);
}
.card.back::before { background: none; }
.card.back .num, .card.back .c1, .card.back .c2, .card.back .dir { display: none; }
.card .emblem { display: none; }
.card.back .emblem { position: absolute; inset: 0; display: grid; place-items: center; font: 900 calc(var(--w) * 0.18) / 1 var(--num-font); letter-spacing: 2px; color: rgba(255, 255, 255, 0.55); }
.card.mini { --w: var(--mini); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); }
.card.mini .c1, .card.mini .c2, .card.mini .dir { display: none; }
.card.mini .emblem { display: none; }
.card.flying { position: fixed; z-index: 70; pointer-events: none; margin: 0; }
.card.bad { box-shadow: 0 0 0 3px var(--red), 0 0 24px rgba(255, 77, 109, 0.8); }
.card.starred { box-shadow: 0 0 0 3px var(--gold), 0 0 24px rgba(255, 209, 102, 0.8); }

/* ---------- game ---------- */
.screen.game.active { display: flex; flex-direction: column; height: calc(100vh - 60px); height: calc(100dvh - 60px); padding: 8px 14px 10px; gap: 6px; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hud-block { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.level-badge { font-weight: 700; color: var(--muted); white-space: nowrap; }
.level-badge b { font: 900 24px/1 var(--num-font); color: var(--ink); }
.level-badge .of { color: var(--muted); }
.level-track { display: flex; gap: 5px; align-items: flex-end; }
.lt { width: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.lt i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); display: block; transition: all 0.4s; }
.lt.done i { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.lt.cur i { border-color: var(--gold); background: rgba(255, 209, 102, 0.35); transform: scale(1.35); animation: pulseDot 1.6s infinite; }
.lt small { font-size: 9px; line-height: 1; height: 10px; }
.mode-chip { font-weight: 700; font-size: 13px; color: var(--muted); }
.res { gap: 14px; }
.lives, .stars { display: flex; gap: 3px; align-items: center; }
.heart { font-size: 20px; display: inline-block; transition: transform 0.3s, filter 0.3s, opacity 0.3s; }
.heart.empty { filter: grayscale(1) brightness(0.5); opacity: 0.35; }
.heart.break { animation: heartBreak 0.9s ease-in forwards; }
.heart.gain { animation: gain 0.9s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes heartBreak { 0% { transform: scale(1.4); } 30% { transform: scale(1.4) rotate(-15deg); filter: none; } 100% { transform: translateY(14px) scale(0.8) rotate(25deg); filter: grayscale(1) brightness(0.5); opacity: 0.35; } }
@keyframes gain { 0% { transform: scale(0); } 70% { transform: scale(1.5); } 100% { transform: scale(1); } }
.shuriken-ico { width: 20px; height: 20px; display: inline-block; background: conic-gradient(from 45deg, var(--gold) 0 12.5%, transparent 0 25%, var(--gold) 0 37.5%, transparent 0 50%, var(--gold) 0 62.5%, transparent 0 75%, var(--gold) 0 87.5%, transparent 0); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px rgba(255, 209, 102, 0.7)); }
.stars .shuriken-ico { width: 22px; height: 22px; background: var(--gold); transition: all 0.3s; }
.stars .shuriken-ico.empty { background: rgba(255, 255, 255, 0.2); filter: none; }
.stars .shuriken-ico.gain { animation: gain 0.9s cubic-bezier(.2, 1.6, .4, 1), spin 1s linear; }
.shuriken-fly { position: fixed; z-index: 72; width: 64px; height: 64px; pointer-events: none; background: var(--gold); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.9)); }

.table-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; justify-content: center; }
.table { position: relative; width: min(100%, 1040px); height: 100%; min-height: 300px; }
.felt { position: absolute; inset: 15% 6% 3% 6%; border-radius: 50%; }
.felt-rim {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #2c2378 0%, #1a1452 55%, #0e0b30 100%);
  box-shadow: inset 0 0 0 2px rgba(94, 242, 255, 0.18), inset 0 0 80px rgba(0, 0, 0, 0.6), 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 calc(30px + var(--tension) * 50px) rgba(94, 242, 255, calc(0.15 - var(--tension) * 0.1));
  transition: box-shadow 0.6s;
}
.felt-rim::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed rgba(177, 140, 255, 0.18); }
.felt-glow { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(94, 242, 255, 0.18), transparent 60%); opacity: 0; transition: opacity 0.6s; }
.table.synced .felt-glow { opacity: 1; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.03); opacity: 0.6; } }
.table.shake { animation: shake 0.55s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px) rotate(-0.4deg); } 40%, 60% { transform: translateX(8px) rotate(0.4deg); } }
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.links path { fill: none; stroke: url(#linkGrad); stroke-width: 2; stroke-linecap: round; opacity: 0; }
.links path.fire { animation: linkFire 0.9s ease-out; }
@keyframes linkFire { 0% { opacity: 0; stroke-dasharray: 4 400; stroke-dashoffset: 0; } 30% { opacity: 1; } 100% { opacity: 0; stroke-dasharray: 400 0; } }

.center { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); width: 1px; height: 1px; }
.piles { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; gap: 36px; align-items: center; transition: opacity 0.4s, filter 0.4s; }
.table.syncing .piles { opacity: 0.35; filter: blur(1px); }
.pile { position: relative; width: var(--cw); height: calc(var(--cw) * 1.45); }
.pile .slot { position: absolute; inset: 0; border-radius: calc(var(--cw) * 0.13); border: 2px dashed rgba(255, 255, 255, 0.18); display: grid; place-items: center; color: rgba(255, 255, 255, 0.35); font: 800 13px/1.2 var(--num-font); text-align: center; }
.pile .card { position: absolute; left: 0; top: 0; transition: opacity 0.2s; }
.pile .card.incoming { opacity: 0; }
.pile .card.land { animation: land 0.35s ease-out; }
@keyframes land { 0% { filter: brightness(1.8); } 100% { filter: none; } }
.pile .pile-label { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--muted); }
.pile .pile-label b { color: var(--ink); }
.pile.up .pile-label b { color: var(--cyan); }
.pile.down .pile-label b { color: #ff8aa0; }
.pile.reveal-bad .card.revealed-bad { box-shadow: 0 0 0 3px var(--red), 0 0 20px rgba(255, 77, 109, 0.9); }

.palms { position: absolute; left: 0; top: 0; }
.palm { position: absolute; font-size: 40px; transform: translate(-50%, -50%) scale(1.8); opacity: 0; transition: transform 0.35s cubic-bezier(.3, 1.5, .5, 1), opacity 0.25s; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5)); }
.palm.down { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg)); }
.table.synced .palm.down { filter: drop-shadow(0 0 12px rgba(94, 242, 255, 0.9)); }
.palm.lift { opacity: 0; transform: translate(-50%, -80%) scale(1.4); transition: transform 0.5s, opacity 0.5s; }
.sync-ring {
  position: absolute; left: 0; top: 0; width: 250px; height: 250px; transform: translate(-50%, -50%) scale(0.8); border-radius: 50%; opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 0.4s, transform 0.4s;
  background: conic-gradient(var(--cyan) calc(var(--p, 0) * 1%), rgba(255, 255, 255, 0.08) 0); -webkit-mask: radial-gradient(circle, transparent 70%, #000 71% 74%, transparent 75%); mask: radial-gradient(circle, transparent 70%, #000 71% 74%, transparent 75%);
}
.sync-text, .sync-sub { position: absolute; left: 50%; transform: translateX(-50%); width: 260px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.sync-text { top: -24px; font: 800 18px/1.2 var(--num-font); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
.sync-sub { top: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.table.syncing .sync-ring { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.table.syncing .sync-text, .table.syncing .sync-sub { opacity: 1; }
.center .sync-text, .center .sync-sub { z-index: 3; }

.seats { position: absolute; inset: 0; pointer-events: none; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 150px; transform: translateX(-50%); pointer-events: auto; transition: transform 0.4s; }
.seat .avatar { width: 74px; height: 74px; position: relative; border-radius: 50%; transition: transform 0.35s cubic-bezier(.3, 1.4, .5, 1), filter 0.3s; }
.seat .avatar::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--seat-color); opacity: 0.6; box-shadow: 0 0 18px var(--seat-color); transition: all 0.3s; }
.seat.active .avatar::before { opacity: 1; box-shadow: 0 0 30px var(--seat-color), 0 0 60px var(--seat-color); }
.seat .avatar svg { width: 100%; height: 100%; display: block; overflow: visible; }
.seat .name { font-weight: 800; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.seat .role { color: var(--muted); font-size: 11px; font-weight: 600; margin-top: -4px; }
.seat .fan { display: flex; justify-content: center; height: calc(var(--mini) * 1.45 + 6px); }
.seat .fan .card { margin-left: calc(var(--mini) * -0.55); transform-origin: 50% 120%; transition: transform 0.3s; }
.seat .fan .card:first-child { margin-left: 0; }
.seat .count { font: 800 12px/1 var(--num-font); color: var(--muted); }
.seat .info, .seat .handrow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.seat.horiz { flex-direction: row; width: 270px; gap: 12px; justify-content: center; }
.seat.horiz .info { align-items: flex-start; gap: 3px; }
.seat.horiz .role { margin-top: 0; }
.seat.horiz .handrow { flex-direction: row; gap: 8px; }
.seat.horiz .reveal { top: calc(100% + 6px); }
.seat.pos-left .reveal { top: 6px; left: calc(50% + 44px); transform: none; }
.seat.pos-right .reveal { top: 6px; left: auto; right: calc(50% + 44px); transform: none; }
.seat.lean .avatar { transform: translateY(8px) scale(1.12); }
.seat.lean .eyes ellipse { transform: scaleY(1.25); }
.seat.played .avatar { animation: played 0.5s ease-out; }
@keyframes played { 30% { transform: scale(1.15) translateY(4px); } }
.seat.oops .avatar { animation: oops 0.6s ease-in-out 2; }
@keyframes oops { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.seat.giggle .avatar { animation: giggle 0.18s linear 6; }
@keyframes giggle { 50% { transform: translateY(-3px) rotate(3deg); } }
.seat.joy .avatar { animation: joy 0.6s ease-out 2; }
@keyframes joy { 40% { transform: translateY(-10px) scale(1.06); } }
.bubble {
  position: absolute; top: -12px; left: 72%; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; background: #fff; color: #1b1530; font-size: 18px; font-weight: 800;
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); opacity: 0; transform: scale(0.4) translateY(10px); transition: all 0.3s cubic-bezier(.3, 1.5, .5, 1); pointer-events: none; white-space: nowrap; z-index: 5;
}
.bubble::after { content: ""; position: absolute; left: 8px; bottom: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bubble.show { opacity: 1; transform: none; }
.bubble.small { font-size: 12px; }
.reveal { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 6; pointer-events: none; }
.reveal .card { --w: 44px; animation: flipIn 0.45s ease-out both; }
@keyframes flipIn { from { transform: rotateY(90deg) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* avatar parts */
.avatar .mouth > * { display: none; }
.avatar.mood-neutral .m-neutral, .avatar.mood-happy .m-smile, .avatar.mood-oops .m-o, .avatar.mood-tense .m-tense, .avatar.mood-grin .m-grin, .avatar.mood-focus .m-neutral { display: inline; }
.avatar .eyes ellipse { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; animation-delay: var(--blink, 0s); transition: transform 0.2s; }
.avatar.mood-focus .eyes ellipse { transform: scaleY(0.55); animation: none; }
.avatar.mood-happy .eyes ellipse, .avatar.mood-grin .eyes ellipse { transform: scaleY(0.4) translateY(1px); animation: none; }
.avatar .brows path { transition: transform 0.25s; transform-box: fill-box; transform-origin: center; }
.avatar.mood-oops .brows path, .avatar.mood-tense .brows path { transform: translateY(-3px); }
.avatar.mood-focus .brows path:first-child { transform: rotate(10deg) translateY(1px); }
.avatar.mood-focus .brows path:last-child { transform: rotate(-10deg) translateY(1px); }
@keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.08); } }

/* discard tray */
.discard { position: absolute; right: 2%; bottom: 2%; width: min(30%, 250px); padding: 8px 10px; border-radius: 14px; background: rgba(8, 6, 26, 0.55); border: 1px solid var(--line); }
.discard-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.discard-cards { display: flex; flex-wrap: wrap; gap: 4px; min-height: calc(var(--mini) * 1.45); }
.discard-cards .card { --w: 28px; }
.discard-cards .card .num { font-size: 12px; }
.discard-cards .card.r-mistake { box-shadow: 0 0 0 2px var(--red); }
.discard-cards .card.r-star { box-shadow: 0 0 0 2px var(--gold); }

.table-msg { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; z-index: 8; width: 90%; }
.table-msg .m { display: inline-block; font: 900 clamp(22px, 3.6vw, 40px)/1.1 var(--num-font); padding: 8px 18px; border-radius: 16px; animation: msgIn 2.4s cubic-bezier(.2, 1.3, .4, 1) forwards; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7); }
.table-msg .m small { display: block; font-size: 0.45em; font-weight: 700; opacity: 0.9; margin-top: 6px; }
.table-msg .m.bad { color: #ff8fa3; }
.table-msg .m.good { color: var(--cyan); }
.table-msg .m.gold { color: var(--gold); }
@keyframes msgIn { 0% { opacity: 0; transform: scale(0.6); } 12% { opacity: 1; transform: scale(1.08); } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }

.vote { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 9; background: rgba(20, 15, 54, 0.94); border: 1px solid rgba(255, 209, 102, 0.4); border-radius: 18px; padding: 14px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); animation: screenIn 0.3s; min-width: 280px; }
.vote-q { font-weight: 800; margin-bottom: 8px; }
.vote-votes { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.vote-votes span { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); }
.vote-btns { display: flex; gap: 10px; justify-content: center; }
.vote-timer { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); margin-top: 12px; overflow: hidden; }
.vote-timer i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }

.demo-banner { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 9; display: flex; gap: 10px; align-items: center; background: rgba(20, 15, 54, 0.9); border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px 8px 16px; }

/* hand area */
.hand-area { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hand-head { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.you-chip { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--ink); }
.you-chip .avatar { width: 34px; height: 34px; }
.you-chip .avatar svg { width: 100%; height: 100%; }
.hand { display: flex; justify-content: center; align-items: flex-end; min-height: calc(var(--cw) * 1.45 + 20px); padding-top: 14px; }
.hand .card { margin: 0 calc(var(--cw) * -0.12); transition: transform 0.25s cubic-bezier(.3, 1.4, .5, 1), box-shadow 0.25s, filter 0.25s; transform: translateY(var(--ty, 0)) rotate(var(--rot, 0deg)); transform-origin: 50% 130%; }
.hand .card.playable { cursor: pointer; --ty: -10px; box-shadow: 0 0 0 2px rgba(94, 242, 255, 0.8), 0 0 28px rgba(94, 242, 255, 0.55), 0 14px 26px rgba(0, 0, 0, 0.5); z-index: 2; }
.hand .card.playable.down { box-shadow: 0 0 0 2px rgba(255, 138, 160, 0.9), 0 0 28px rgba(255, 77, 109, 0.55), 0 14px 26px rgba(0, 0, 0, 0.5); }
.hand .card.playable:hover { --ty: -22px; }
.hand .card.locked { filter: saturate(0.6) brightness(0.8); }
.hand .card.deal { animation: dealIn 0.55s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes dealIn { from { transform: translateY(-160px) rotateY(180deg) scale(0.5); opacity: 0; } to { transform: translateY(var(--ty, 0)) rotate(var(--rot, 0deg)); opacity: 1; } }
.hand .card.leaving { visibility: hidden; }
.hand-empty { color: var(--muted); font-weight: 700; padding: 20px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.hand-btn { background: linear-gradient(135deg, #18b88a, #19c7d6); }
.hand-btn .big { font-size: 20px; }
.hand-btn.pulse { animation: pulseBtn 1.4s infinite; }
@keyframes pulseBtn { 50% { box-shadow: 0 0 0 10px rgba(25, 199, 214, 0.0), 0 0 30px rgba(25, 199, 214, 0.8); } }
.star-btn { background: linear-gradient(135deg, #c98a12, #ff9f1c); box-shadow: 0 8px 24px rgba(255, 159, 28, 0.3); }
.star-btn .shuriken-ico { background: #fff; }

/* overlay / modal */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5, 4, 18, 0.7); backdrop-filter: blur(6px); padding: 16px; animation: fade 0.3s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: linear-gradient(180deg, #1c1550, #120d36); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 22px; padding: 26px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7); animation: modalIn 0.45s cubic-bezier(.2, 1.3, .4, 1); text-align: center; }
@keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } }
.modal h2 { font-size: clamp(24px, 4vw, 34px); }
.modal .big-ico { font-size: 54px; margin-bottom: 6px; display: inline-block; animation: gain 0.8s cubic-bezier(.2, 1.6, .4, 1); }
.modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.modal .reward { display: inline-flex; gap: 10px; align-items: center; font-size: 22px; font-weight: 800; margin: 10px 0; padding: 10px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.07); animation: gain 0.8s 0.3s both cubic-bezier(.2, 1.6, .4, 1); }
.modal .muted { color: var(--muted); }
.modal .endgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; text-align: left; margin-top: 18px; }
.modal canvas.share { width: 100%; border-radius: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); display: block; }
.rating { display: flex; gap: 6px; justify-content: flex-start; }
.rating button { font-size: 28px; background: none; border: 0; filter: grayscale(1) opacity(0.5); transition: transform 0.2s, filter 0.2s; padding: 2px; }
.rating button.on, .rating button:hover { filter: none; transform: scale(1.18); }
.seg { display: inline-flex; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--cyan); color: #06121a; }
.lc-cards { display: flex; justify-content: center; gap: 0; margin: 14px 0 4px; }
.lc-cards .card { --w: 44px; margin-left: -18px; animation: dealIn 0.5s both cubic-bezier(.2, 1.2, .4, 1); }
.lc-cards .card:first-child { margin-left: 0; }

/* coach & toasts */
.coach { position: fixed; left: 16px; bottom: 16px; z-index: 45; max-width: 380px; display: flex; gap: 10px; align-items: flex-start; background: rgba(28, 21, 80, 0.96); border: 1px solid rgba(94, 242, 255, 0.4); border-radius: 16px; padding: 12px 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5); animation: screenIn 0.35s; }
.coach-ico { font-size: 22px; }
.coach-text { font-size: 14px; line-height: 1.45; flex: 1; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 65; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: rgba(28, 21, 80, 0.96); border: 1px solid rgba(255, 209, 102, 0.5); border-radius: 14px; padding: 10px 14px; font-weight: 700; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); animation: toastIn 4s forwards; }
@keyframes toastIn { 0% { opacity: 0; transform: translateX(40px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(40px); } }

/* setup */
.setup-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
.persona-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.persona { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.04); border: 2px solid var(--line); transition: all 0.25s; position: relative; }
.persona:hover { border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
.persona.on { border-color: var(--seat-color); background: color-mix(in srgb, var(--seat-color) 12%, transparent); box-shadow: 0 0 24px color-mix(in srgb, var(--seat-color) 35%, transparent); }
.persona.on::after { content: "✓"; position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--seat-color); color: #0b0820; font-weight: 900; display: grid; place-items: center; font-size: 13px; }
.persona .avatar { width: 64px; height: 64px; flex: 0 0 64px; }
.persona .avatar svg { width: 100%; height: 100%; }
.persona b { display: block; font-size: 16px; }
.persona .r { color: var(--seat-color); font-size: 12px; font-weight: 800; }
.persona p { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.opt-list { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 2px solid var(--line); transition: all 0.2s; width: 100%; }
.opt:hover { border-color: rgba(255, 255, 255, 0.3); }
.opt.on { border-color: var(--cyan); background: rgba(94, 242, 255, 0.08); }
.opt b { display: block; }
.opt small { color: var(--muted); display: block; margin-top: 2px; line-height: 1.35; }
.opt .ico { font-size: 22px; width: 30px; text-align: center; }
.switch { margin-left: auto; width: 42px; height: 24px; border-radius: 12px; background: rgba(255, 255, 255, 0.15); position: relative; flex: 0 0 42px; transition: background 0.2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.opt.on .switch { background: var(--cyan); }
.opt.on .switch::after { transform: translateX(18px); }
.summary { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.summary .s { font: 800 18px/1.3 var(--num-font); }
.summary small { color: var(--muted); display: block; font-weight: 600; font-family: system-ui; font-size: 12px; }
.warn { color: var(--gold); font-size: 13px; font-weight: 700; min-height: 18px; }

/* teach */
.teach { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: stretch; }
.teach-stage { position: relative; min-height: 340px; border-radius: 20px; background: radial-gradient(ellipse at 50% 60%, #2c2378, #120d36); border: 1px solid var(--line); overflow: hidden; }
.teach-text { display: flex; flex-direction: column; gap: 14px; }
.teach-step { font-size: clamp(19px, 2.1vw, 24px); font-weight: 700; line-height: 1.45; min-height: 140px; animation: screenIn 0.5s; }
.teach-step .n { color: var(--cyan); font: 900 46px/1 var(--num-font); display: block; margin-bottom: 6px; }
.timer { display: flex; align-items: center; gap: 12px; }
.timer .ring { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font: 900 18px/1 var(--num-font); background: conic-gradient(var(--cyan) calc(var(--p) * 1%), rgba(255, 255, 255, 0.1) 0); position: relative; }
.timer .ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #17113f; }
.timer .ring span { position: relative; }
.dots { display: flex; gap: 6px; }
.dots i { width: 26px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); display: block; transition: background 0.3s; }
.dots i.on { background: var(--cyan); }
.tip { border-left: 3px solid var(--gold); padding: 10px 14px; background: rgba(255, 209, 102, 0.07); border-radius: 0 12px 12px 0; }
.tip b { color: var(--gold); display: block; margin-bottom: 4px; }
.stage-scene { position: absolute; inset: 0; }
.stage-scene .card { position: absolute; --cw: 64px; }
.stage-caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; }

/* faq */
.faq { display: grid; gap: 10px; }
.faq details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; transition: background 0.2s; }
.faq details[open] { background: var(--panel2); }
.faq summary { cursor: pointer; padding: 14px 0; font-weight: 800; list-style: none; display: flex; align-items: center; gap: 10px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::before { content: "+"; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(94, 242, 255, 0.15); color: var(--cyan); flex: 0 0 24px; transition: transform 0.2s; }
.faq details[open] summary::before { content: "–"; }
.faq details p { margin: 0 0 14px 34px; color: var(--muted); line-height: 1.55; }

/* journal */
.stat { text-align: center; }
.stat b { display: block; font: 900 30px/1 var(--num-font); color: var(--cyan); }
.stat span { color: var(--muted); font-size: 12px; font-weight: 700; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); text-align: center; position: relative; }
.badge .i { font-size: 30px; display: block; filter: grayscale(1) opacity(0.4); }
.badge b { display: block; font-size: 13px; margin-top: 6px; }
.badge small { color: var(--muted); font-size: 11px; line-height: 1.3; display: block; margin-top: 3px; }
.badge.on { border-color: rgba(255, 209, 102, 0.5); background: rgba(255, 209, 102, 0.07); }
.badge.on .i { filter: none; animation: bob 3s ease-in-out infinite; }
table.log { width: 100%; border-collapse: collapse; font-size: 14px; }
table.log th, table.log td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
table.log th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.empty-note { color: var(--muted); padding: 18px 0; }
.bests { display: flex; justify-content: center; gap: 16px; }
.bests i { font-style: normal; display: flex; flex-direction: column; align-items: center; }
.stat .bests b { font-size: 26px; }
.bests small { color: var(--muted); font-weight: 700; font-size: 11px; }

/* responsive */
@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 10px; }
  .hero-art { height: 300px; order: -1; }
  #heroCards { transform: scale(0.72); }
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .setup-grid, .teach { grid-template-columns: 1fr; }
  .modal .endgrid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {

  <script id="mind-audio">
/* WebAudio synth: no audio files needed. */
(function (global) {
  'use strict';

  const Sound = {
    ctx: null,
    master: null,
    enabled: true,

    ensure() {
      if (!this.enabled) return null;
      if (!this.ctx) {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.55;
        const comp = this.ctx.createDynamicsCompressor();
        this.master.connect(comp);
        comp.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },

    tone(o) {
      const ctx = this.ensure();
      if (!ctx) return;

/* Visual effects: neural-network background (the "mind link") + particle / confetti overlay. */
(function (global) {
  'use strict';

  const reduced = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const FX = {
    reduced,
    tension: 0,
    nodes: [],
    pulses: [],
    particles: [],
    links: [],

    init() {
      this.bg = document.getElementById('bg');
      this.fx = document.getElementById('fx');
      this.bgc = this.bg.getContext('2d');
      this.fxc = this.fx.getContext('2d');
      this.resize();
      global.addEventListener('resize', () => this.resize());
      this.last = performance.now();
      const loop = (t) => {
        const dt = Math.min(0.05, (t - this.last) / 1000);
        this.last = t;
        this.drawBg(dt, t);
        this.drawFx(dt);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    },

    resize() {
      const dpr = Math.min(2, global.devicePixelRatio || 1);
      this.dpr = dpr;
      this.w = global.innerWidth;
      this.h = global.innerHeight;
      for (const c of [this.bg, this.fx]) {
        c.width = this.w * dpr;
        c.height = this.h * dpr;
        c.style.width = this.w + 'px';
        c.style.height = this.h + 'px';
      }
      this.bgc.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(reduced ? 35 : 85, Math.round((this.w * this.h) / 15000));
      this.nodes = [];
      for (let i = 0; i < count; i++) {
        this.nodes.push({
          x: Math.random() * this.w, y: Math.random() * this.h,
          vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
          r: 1 + Math.random() * 1.8, glow: 0, hue: Math.random() < 0.5 ? 190 : 280,
        });
      }
    },

    drawBg(dt, t) {
      const c = this.bgc, w = this.w, h = this.h;
      c.clearRect(0, 0, w, h);
      const speed = reduced ? 0.2 : 1 - this.tension * 0.75;
      const maxD = Math.min(170, Math.max(110, w / 9));
      for (const n of this.nodes) {
        n.x += n.vx * dt * speed;
        n.y += n.vy * dt * speed;
        if (n.x < -20) n.x = w + 20; if (n.x > w + 20) n.x = -20;
        if (n.y < -20) n.y = h + 20; if (n.y > h + 20) n.y = -20;
        n.glow = Math.max(0, n.glow - dt * 0.9);
      }
      for (const p of this.pulses) {
        p.r += p.speed * dt;
        p.life -= dt;
        for (const n of this.nodes) {
          const d = Math.hypot(n.x - p.x, n.y - p.y);
          if (Math.abs(d - p.r) < 28) n.glow = Math.min(1, n.glow + 0.5 * p.power);
        }
      }
      this.pulses = this.pulses.filter((p) => p.life > 0);

      const baseAlpha = 0.16 * (1 - this.tension * 0.55);
      c.lineWidth = 1;
      for (let i = 0; i < this.nodes.length; i++) {
        const a = this.nodes[i];
        for (let j = i + 1; j < this.nodes.length; j++) {
          const b = this.nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > maxD * maxD) continue;
          const k = 1 - Math.sqrt(d2) / maxD;
          const glow = (a.glow + b.glow) * 0.5;
          c.strokeStyle = `hsla(${glow > 0.05 ? 175 : 250}, 90%, ${60 + glow * 25}%, ${k * (baseAlpha + glow * 0.6)})`;
          c.beginPath();
          c.moveTo(a.x, a.y);
          c.lineTo(b.x, b.y);
          c.stroke();
        }
      }
      for (const n of this.nodes) {
        c.fillStyle = `hsla(${n.hue}, 90%, ${65 + n.glow * 25}%, ${0.35 + n.glow * 0.65})`;
        c.beginPath();
        c.arc(n.x, n.y, n.r + n.glow * 2.5, 0, Math.PI * 2);
        c.fill();
      }
      for (const p of this.pulses) {
        c.strokeStyle = `hsla(${p.hue}, 95%, 70%, ${Math.max(0, p.life / p.maxLife) * 0.35 * p.power})`;

        c.beginPath();
        c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        c.stroke();

    },

    pulse(x, y, opts) {
      const o = opts || {};
      this.pulses.push({ x, y, r: 0, speed: o.speed || 520, life: o.life || 1.4, maxLife: o.life || 1.4, power: o.power || 1, hue: o.hue || 180 });
    },

    burst(x, y, opts) {
      const o = opts || {};
      const n = reduced ? Math.min(10, o.count || 24) : o.count || 24;
      const colors = o.colors || ['#5ef2ff', '#b18cff', '#ffffff'];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (o.speed || 260) * (0.35 + Math.random() * 0.8);
        this.particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.lift || 0),
          life: 0.6 + Math.random() * (o.life || 0.7), age: 0, size: 2 + Math.random() * (o.size || 3),
          color: colors[i % colors.length], g: o.gravity != null ? o.gravity : 240, shape: o.shape || 'dot', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
        });
      }
    },

    confetti(seconds) {
      if (reduced) { this.burst(this.w / 2, this.h / 3, { count: 40 }); return; }
      const colors = ['#ff5ea8', '#ffd166', '#5ef2ff', '#8bff9a', '#b18cff', '#ffffff'];
      const end = performance.now() + (seconds || 3) * 1000;
      const spawn = () => {
        for (let i = 0; i < 6; i++) {
          this.particles.push({
            x: Math.random() * this.w, y: -10, vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 160,
            life: 4, age: 0, size: 5 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
            g: 60, shape: 'rect', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
          });
        }
        if (performance.now() < end) requestAnimationFrame(spawn);
      };
      spawn();
    },

    drawFx(dt) {
      const c = this.fxc;
      c.clearRect(0, 0, this.w, this.h);
      for (const p of this.particles) {
        p.age += dt;
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const a = Math.max(0, 1 - p.age / p.life);
        c.globalAlpha = a;
        c.fillStyle = p.color;
        if (p.shape === 'rect') {
          c.save();
          c.translate(p.x, p.y);
          c.rotate(p.rot);
          c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          c.restore();
        } else if (p.shape === 'star') {
          c.save();
          c.translate(p.x, p.y);
          c.rotate(p.rot);
          c.beginPath();
          for (let i = 0; i < 8; i++) {
            const r = i % 2 ? p.size * 0.4 : p.size * 1.3;
            c.lineTo(Math.cos((i * Math.PI) / 4) * r, Math.sin((i * Math.PI) / 4) * r);
          }
          c.closePath();
          c.fill();
          c.restore();
        } else {
          c.beginPath();
          c.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2);
          c.fill();
        }
      }
      c.globalAlpha = 1;
      this.particles = this.particles.filter((p) => p.age < p.life && p.y < this.h + 40);
    },

    centerOf(el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    },
  };

  global.FX = FX;

/* localStorage persistence: settings, played log, reviews, badges, seen coach tips. */
(function (global) {
  'use strict';

  const KEY = 'theMind.bgc.v1';
  const DEFAULTS = {
    lang: null,
    sound: true,
    settings: { team: ['elif', 'ece'], variant: 'classic', difficulty: 'easy', tells: true, adapt: true, coach: true, heart: true },
    log: [],
    badges: {},
    tips: {},
  };

  const Store = {
    data: null,

    load() {
      let saved = null;
      try { saved = JSON.parse(global.localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
      const d = JSON.parse(JSON.stringify(DEFAULTS));
      if (saved && typeof saved === 'object') {
        Object.assign(d, saved);
        d.settings = Object.assign({}, DEFAULTS.settings, saved.settings || {});
      }
      this.data = d;
      return d;
    },

    save() {
      try { global.localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* storage may be unavailable (private mode) */ }
    },

    addGame(entry) {
      this.data.log.unshift(entry);
      this.data.log = this.data.log.slice(0, 200);
      this.save();
    },

    updateGame(id, patch) {
      const g = this.data.log.find((x) => x.id === id);
      if (g) { Object.assign(g, patch); this.save(); }
    },

    unlock(id) {
      if (this.data.badges[id]) return false;
      this.data.badges[id] = Date.now();
      this.save();
      return true;
    },

    tipSeen(id) {
      if (this.data.tips[id]) return true;
      this.data.tips[id] = 1;
      this.save();
      return false;
    },

    clear() {
      const keep = { lang: this.data.lang, sound: this.data.sound, settings: this.data.settings };
      this.data = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), keep);
      this.save();
    },

    stats() {
      const log = this.data.log;
      const best = {};
      let wins = 0, syncs = 0, flawless = 0, rec = 0, recTotal = 0;
      for (const g of log) {
        if (g.won) wins++;
        syncs += g.perfectSyncs || 0;
        flawless += g.flawless || 0;
        const k = g.players.length;
        best[k] = Math.max(best[k] || 0, g.won ? g.maxLevel : g.level);
        if (g.recommend != null) { recTotal++; if (g.recommend) rec++; }
      }
      return { games: log.length, wins, syncs, flawless, best, rec, recTotal };
    },
  };

  global.Store = Store;

      this.renderHud();
      this.bind();
      if (!this.demo) {
        const you = meta.you;
        $('#youChip').innerHTML = `<span class="avatar">${avatarSVG(you.look)}</span><span>${t('msg.you')}</span>`;
      }
      if (!this._resizeBound) {
        this._resizeBound = true;
        global.addEventListener('resize', () => { if (this.engine) this.layoutLinks(); });
      }
    },

    name(pid) {
      const m = this.meta.players[pid];
      return m && m.human ? t('msg.you') : (m ? m.name : pid);
    },

    /* ---------- layout ---------- */
    layoutSeats() {
      const seats = $('#seats');
      const palms = $('#palms');
      seats.innerHTML = '';
      palms.innerHTML = '';
      this.seatEls = {};
      this.palmEls = {};
      const bots = this.engine.players.filter((p) => !p.human);
      const pos = POS[bots.length] || POS[3];
      this.seatPos = {};
      bots.forEach((b, i) => {
        const m = this.meta.players[b.id];
        const p = pos[i];
        this.seatPos[b.id] = p;
        const el = document.createElement('div');
        el.className = 'seat pos-' + p + (p.startsWith('top') ? ' horiz' : '');
        el.dataset.pid = b.id;
        el.style.setProperty('--seat-color', m.look.color);
        el.style.left = SEAT_XY[p][0] + '%';
        el.style.top = SEAT_XY[p][1] + '%';
        el.innerHTML = `
          <div class="avatar mood-neutral" style="--blink:${(i * 1.7).toFixed(1)}s">${avatarSVG(m.look)}<div class="bubble"></div></div>
          <div class="info">
            <div class="name">${m.name}</div>
            <div class="role">${m.role || ''}</div>
            <div class="handrow"><div class="fan"></div><div class="count"></div></div>
          </div>
          <div class="reveal"></div>`;
        seats.appendChild(el);
        this.seatEls[b.id] = el;
      });
      for (const p of this.engine.players) {
        const palm = document.createElement('div');
        palm.className = 'palm';
        const m = this.meta.players[p.id];
        palm.textContent = (m && m.look.hand) || '✋';
        const ang = p.human ? PALM_ANGLE.human : PALM_ANGLE[this.seatPos[p.id]];
        const rad = (ang * Math.PI) / 180;
        palm.style.left = Math.cos(rad) * 150 + 'px';
        palm.style.top = Math.sin(rad) * 95 + 'px';
        palm.style.setProperty('--rot', (ang - 90) + 'deg');
        palms.appendChild(palm);
        this.palmEls[p.id] = palm;
      }
      this.renderPiles();
      this.renderFans();
      this.renderDiscard();
      requestAnimationFrame(() => this.layoutLinks());
    },

    layoutLinks() {
      const svg = $('#links');
      const tr = this.table.getBoundingClientRect();
      const pileEl = $('#piles');
      if (!pileEl || !tr.width) return;
      const c = FX.centerOf(pileEl);
      const cx = c.x - tr.left, cy = c.y - tr.top;
      let html = '<defs><linearGradient id="linkGrad" x1="0" x2="1"><stop offset="0" stop-color="#5ef2ff"/><stop offset="1" stop-color="#ff5ea8"/></linearGradient></defs>';
      for (const p of this.engine.players) {
        let x, y;
        if (p.human) { x = tr.width / 2; y = tr.height + 30; } else {
          const a = this.seatEls[p.id].querySelector('.avatar');
          const r = a.getBoundingClientRect();
          x = r.left + r.width / 2 - tr.left;
          y = r.top + r.height / 2 - tr.top;
        }
        const mx = (x + cx) / 2 + (cy - y) * 0.15, my = (y + cy) / 2 - 30;
        html += `<path data-pid="${p.id}" d="M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}"/>`;
      }
      svg.innerHTML = html;
    },

    fireLink(pid) {
      const path = document.querySelector(`#links path[data-pid="${pid}"]`);
      if (!path) return;
      path.classList.remove('fire');
      void path.getBoundingClientRect();
      path.classList.add('fire');
    },

    /* ---------- HUD ---------- */
    renderHud() {
      const e = this.engine;
      $('#hudLevel').textContent = Math.max(1, e.level);
      $('#hudMax').textContent = e.maxLevel;
      const track = $('#levelTrack');
      let html = '';
      for (let i = 1; i <= e.maxLevel; i++) {
        const r = i < e.maxLevel ? e.rewardFor(i) : null;
        const cls = i < e.level || (i === e.level && ['levelComplete', 'victory'].includes(e.phase)) ? 'done' : i === e.level ? 'cur' : '';
        html += `<div class="lt ${cls}" title="${t('hud.level')} ${i}"><i></i><small>${r === 'star' ? '⭐' : r === 'life' ? '❤️' : ''}</small></div>`;
      }
      track.innerHTML = html;
      const s = this.settings;
      $('#hudMode').textContent = `${t('mode.' + e.variantId + '.t')} · ${t('diff.' + e.difficultyId + '.t')}${s.tells ? ' · 👀' : ' · 🤫'}`;
      this.renderLives();
      this.renderStars();
    },

    renderLives() {
      const e = this.engine;
      const el = $('#hudLives');
      const slots = Math.max(e.lives, this.prevLives, e.players.length);
      let html = '';
      for (let i = 0; i < slots; i++) {
        let cls = i < e.lives ? '' : 'empty';
        if (e.lives < this.prevLives && i >= e.lives && i < this.prevLives) cls = 'break';
        if (e.lives > this.prevLives && i >= this.prevLives && i < e.lives) cls = 'gain';
        html += `<span class="heart ${cls}">❤️</span>`;
      }
      el.innerHTML = html;
      el.setAttribute('aria-label', `${t('hud.lives')}: ${e.lives}`);
      this.prevLives = e.lives;
    },

    renderStars() {
      const e = this.engine;
      const el = $('#hudStars');
      const slots = Math.max(e.stars, this.prevStars, 1);
      let html = '';
      for (let i = 0; i < slots; i++) {
        let cls = i < e.stars ? '' : 'empty';
        if (e.stars > this.prevStars && i >= this.prevStars && i < e.stars) cls = 'gain';
        html += `<span class="shuriken-ico ${cls}"></span>`;
      }
      el.innerHTML = html;
      el.setAttribute('aria-label', `${t('hud.stars')}: ${e.stars}`);
      el.title = `${t('hud.stars')}: ${e.stars}`;
      this.prevStars = e.stars;
    },

    /* ---------- table pieces ---------- */
    renderPiles() {
      const e = this.engine;
      if (this.revealing) return;
      const wrap = $('#piles');
      wrap.innerHTML = '';
      const dual = e.piles.length > 1;
      for (const p of e.piles) {
        const el = document.createElement('div');
        el.className = 'pile ' + (p.dir > 0 ? 'up' : 'down');
        el.dataset.pile = p.id;
        el.innerHTML = `<div class="slot">${p.dir > 0 ? '▲<br>1 → 100' : '▼<br>100 → 1'}</div>`;
        const show = p.cards.slice(-6);
        show.forEach((c, i) => {
          const blindCard = e.blind && !this.revealed;
          const ce = cardEl(blindCard ? '' : c.v, p.id, { back: blindCard, dual });
          const depth = show.length - 1 - i;
          ce.style.transform = `translate(${depth * -2}px, ${depth * -2}px) rotate(${rotFor(c.v + i)}deg)`;
          if (this.inFlight.has(p.id + ':' + c.v)) ce.classList.add('incoming');
          el.appendChild(ce);
        });
        const label = document.createElement('div');
        label.className = 'pile-label';
        const top = e.blind ? `<b>${t('pile.blind')}</b>` : `<b>${p.cards.length ? p.top : p.dir > 0 ? '0' : '101'}</b>`;
        label.innerHTML = `${t('hud.pile')} ${top} · ${cardsLabel(p.cards.length)}`;
        el.appendChild(label);
        wrap.appendChild(el);
      }
    },

    pileEl(id) { return document.querySelector(`#piles .pile[data-pile="${id}"]`); },

    renderFans() {
      for (const p of this.engine.players) {
        if (p.human) continue;
        const seat = this.seatEls[p.id];
        if (!seat) continue;
        const fan = seat.querySelector('.fan');
        const n = p.hand.length;
        fan.innerHTML = '';
        const shown = Math.min(n, 8);
        for (let i = 0; i < shown; i++) {
          const ce = cardEl('', null, { back: true, mini: true });
          ce.style.transform = `rotate(${(i - (shown - 1) / 2) * 7}deg)`;
          fan.appendChild(ce);
        }
        seat.querySelector('.count').textContent = n ? cardsLabel(n) : '✓';
      }
    },

    renderHand(deal) {
      if (this.demo) return;
      const e = this.engine;
      const h = e.human;
      const el = $('#hand');
      el.innerHTML = '';
      const dual = e.piles.length > 1;
      if (!h.hand.length) {
        el.innerHTML = `<div class="hand-empty">✓</div>`;
      }
      const urgent = new Set(e.piles.map((p) => e.urgent(h, p.id)).filter(Boolean));
      const n = h.hand.length;
      const spread = Math.min(7, 44 / Math.max(1, n));
      h.hand.forEach((c, i) => {
        const ce = cardEl(c.v, c.pile, { dual });
        const off = i - (n - 1) / 2;
        ce.style.setProperty('--rot', (off * spread).toFixed(1) + 'deg');
        ce.style.setProperty('--ty', (Math.abs(off) * Math.abs(off) * 1.4).toFixed(1) + 'px');
        if (urgent.has(c) && e.phase === 'playing') {
          ce.classList.add('playable');
          ce.setAttribute('role', 'button');
          ce.setAttribute('tabindex', '0');
          ce.setAttribute('aria-label', `${c.v}`);
          ce.addEventListener('click', () => global.App.humanPlay(c.pile));
          ce.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') global.App.humanPlay(c.pile); });
        } else if (e.phase !== 'playing') {
          ce.classList.add('locked');
        }
        if (deal) {
          ce.classList.add('deal');
          ce.style.animationDelay = (0.25 + i * 0.09) + 's';
        }
        el.appendChild(ce);
      });
      $('#handHint').textContent = dual ? t('hand.hintDual') : t('hand.hint');
    },

    renderDiscard() {
      const el = $('#discardCards');
      el.innerHTML = '';
      for (const d of this.engine.discard) {
        const ce = cardEl(d.v, d.pile, { mini: true });
        ce.classList.add('r-' + d.reason);
        ce.title = `${this.name(d.by)} · ${d.v}`;
        el.appendChild(ce);
      }
    },

    renderControls() {
      if (this.demo) return;
      const e = this.engine;
      const h = e.human;
      const sync = e.phase === 'sync';
      const handBtn = $('#handBtn');
      handBtn.style.display = sync && !h.handDown ? '' : 'none';
      handBtn.classList.toggle('pulse', sync && !h.handDown);
      const star = $('#starBtn');
      star.style.display = sync && !h.handDown ? 'none' : '';
      star.disabled = !(e.phase === 'playing' && e.stars > 0);
      const ref = $('#refocusBtn');
      ref.style.display = sync && !h.handDown ? 'none' : '';
      ref.disabled = !(e.phase === 'playing' && !e.blind);
    },

    /* ---------- feedback helpers ---------- */
    message(html, cls, ms) {
      const box = $('#tableMsg');
      const m = document.createElement('div');
      m.className = 'm ' + (cls || '');
      m.innerHTML = html;
      if (ms) m.style.animationDuration = ms + 'ms';
      box.innerHTML = '';
      box.appendChild(m);
    },

    bubble(pid, html, ms, small) {
      const seat = this.seatEls[pid];
      if (!seat) return;
      const b = seat.querySelector('.bubble');
      b.innerHTML = html;
      b.classList.toggle('small', !!small);
      b.classList.add('show');
      clearTimeout(b._t);
      if (ms !== 0) b._t = setTimeout(() => b.classList.remove('show'), ms || 1600);
    },

    clearBubbles() {
      for (const id in this.seatEls) this.seatEls[id].querySelector('.bubble').classList.remove('show');
    },

    mood(pid, mood, ms) {
      const seat = this.seatEls[pid];
      if (!seat) return;
      const a = seat.querySelector('.avatar');
      a.className = 'avatar mood-' + mood;
      clearTimeout(a._t);
      a._t = null;
      if (ms) {
        a._t = setTimeout(() => {
          a._t = null;
          if (this.engine) a.className = 'avatar mood-' + (this.engine.phase === 'playing' ? 'focus' : 'neutral');
        }, ms);
      }
    },

    seatAnim(pid, cls, ms) {
      const seat = this.seatEls[pid];
      if (!seat) return;
      seat.classList.remove(cls);
      void seat.offsetWidth;
      seat.classList.add(cls);
      setTimeout(() => seat.classList.remove(cls), ms || 900);
    },

    allMoods(mood, ms) { for (const id in this.seatEls) this.mood(id, mood, ms); },

    flash(kind) {
      const f = $('#flash');
      f.className = 'flash ' + (kind || '');
      void f.offsetWidth;
      f.classList.add('on');
    },

    sr(text) { $('#srLive').textContent = text; },

    fly(o) {
      const to = o.to.getBoundingClientRect ? o.to.getBoundingClientRect() : o.to;
      const from = o.from;
      const w = o.width || to.width;
      const h = w * 1.45;
      const left = to.left + to.width / 2 - w / 2;
      const top = to.top + to.height / 2 - h / 2;
      const el = cardEl(o.v, o.pile, { back: !!o.startBack, dual: this.engine.piles.length > 1 });
      el.classList.add('flying');
      el.style.setProperty('--w', w + 'px');
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      document.body.appendChild(el);
      const sx = Math.min(from.width, from.height / 1.45) / w;
      const dx = from.left + from.width / 2 - (left + w / 2);
      const dy = from.top + from.height / 2 - (top + h / 2);
      const r0 = o.rotFrom || 0, r1 = o.rotTo || 0;
      const dur = FX.reduced ? 1 : o.duration || 520;
      const anim = el.animate([
        { transform: `translate(${dx}px, ${dy}px) scale(${sx}) rotate(${r0}deg)` },
        { transform: `translate(${dx * 0.35}px, ${dy * 0.35 - 50}px) scale(${Math.max(1, sx) * 1.18}) rotate(${(r0 + r1) / 2 + 8}deg)`, offset: 0.55 },
        { transform: `translate(0, 0) scale(1) rotate(${r1}deg)` },
      ], { duration: dur, easing: 'cubic-bezier(.3,.7,.3,1)' });
      if (o.startBack && !o.endBack) setTimeout(() => el.classList.remove('back'), dur * 0.35);
      if (o.endBack) el.classList.add('back');
      return anim.finished.then(() => el.remove(), () => el.remove());
    },

    trayRect(i) {
      const tray = $('#discardCards');
      const W = 28, H = 40.6, gap = 4;
      const last = tray.lastElementChild;
      const r = last ? last.getBoundingClientRect() : tray.getBoundingClientRect();
      const x0 = last ? r.right + gap : r.left;
      return { left: x0 + i * (W + gap), top: r.top, width: W, height: H };
    },

    fromRectFor(pid, v) {
      if (this.meta.players[pid].human) {
        const c = document.querySelector(`#hand .card[data-v="${v}"]`);
        if (c) return { rect: c.getBoundingClientRect(), el: c };
        const h = $('#hand').getBoundingClientRect();
        return { rect: { left: h.left + h.width / 2 - 40, top: h.top, width: 80, height: 116 } };
      }
      const seat = this.seatEls[pid];
      const fan = seat.querySelector('.fan');
      const last = fan.lastElementChild || seat.querySelector('.avatar');
      return { rect: last.getBoundingClientRect(), el: last };
    },

    coach(key, vars) {
      if (this.demo || !this.settings.coach) return;
      if (global.Store.tipSeen('coach.' + key)) return;
      $('#coachText').textContent = t('coach.' + key, vars);
      $('#coach').hidden = false;
      clearTimeout(this._coachT);
      this._coachT = setTimeout(() => { $('#coach').hidden = true; }, 11000);
    },

    /* ---------- engine events ---------- */
    bind() {
      const e = this.engine;
      e.on('levelStart', (d) => this.onLevelStart(d));
      e.on('syncStart', (d) => this.onSyncStart(d));
      e.on('handDown', (d) => this.onHandDown(d));
      e.on('allHandsDown', () => this.onAllDown());
      e.on('playing', (d) => this.onPlaying(d));
      e.on('play', (d) => this.onPlay(d));
      e.on('perfectSync', (d) => this.onPerfectSync(d));
      e.on('mistake', (d) => this.onMistake(d));
      e.on('starProposed', (d) => this.onStarProposed(d));
      e.on('starVote', (d) => this.onStarVote(d));
      e.on('starRejected', (d) => this.onStarRejected(d));
      e.on('star', (d) => this.onStar(d));
      e.on('reveal', (d) => this.onReveal(d));
      e.on('refocusCalled', (d) => {
        this.refocusBy = d.playerId;
        if (d.playerId && !this.meta.players[d.playerId].human) this.bubble(d.playerId, '✋', 1500);
      });
      e.on('levelComplete', () => this.onLevelDoneVisual());
      e.on('victory', () => this.onLevelDoneVisual());
    },

    onLevelStart(d) {
      this.revealed = false;
      this.revealing = false;
      this.giggled = {};
      this.clearBubbles();
      this.renderHud();
      this.renderPiles();
      this.renderDiscard();
      this.renderHand(true);
      const centerRect = $('#piles').getBoundingClientRect();
      const start = { left: centerRect.left + centerRect.width / 2 - 20, top: centerRect.top + centerRect.height / 2 - 29, width: 40, height: 58 };
      let k = 0;
      for (const p of this.engine.players) {
        if (p.human) continue;
        const seat = this.seatEls[p.id];
        seat.querySelector('.fan').innerHTML = '';
        seat.querySelector('.count').textContent = '';
        const n = Math.min(p.hand.length, 4);
        for (let i = 0; i < n; i++) {
          const delay = 120 + k++ * 70;
          setTimeout(() => {
            Sound.deal();
            this.fly({ v: '', pile: null, from: start, to: seat.querySelector('.avatar'), width: 34, startBack: true, endBack: true, duration: 420, rotTo: (Math.random() - 0.5) * 30 });
          }, delay);
        }
      }
      setTimeout(() => this.renderFans(), 120 + k * 70 + 420);
      if (!this.demo) for (let i = 0; i < Math.min(this.engine.human.hand.length, 6); i++) setTimeout(() => Sound.deal(), 250 + i * 90);
      this.message(`${t('hud.level')} ${d.level}<small>${t(d.level === 1 ? 'level.deal1' : 'level.deal', { n: d.level })}</small>`, 'good', 2200);
    },

    onSyncStart(d) {
      this.table.classList.add('syncing');
      this.table.classList.remove('synced');
      for (const id in this.palmEls) this.palmEls[id].className = 'palm';
      const key = d.reason === 'level' ? 'sync.level' : d.reason === 'mistake' ? 'sync.mistake' : d.reason === 'pause' ? 'sync.pause' : 'sync.refocus';
      $('#syncText').textContent = t(key, { n: this.engine.level, who: this.refocusBy ? this.name(this.refocusBy) : '' });
      $('#syncSub').textContent = this.demo ? t('sync.waiting') : t('sync.press');
      this.allMoods('neutral');
      this.renderHand(false);
      this.renderControls();
      this.coach('sync');
    },

    onHandDown(d) {
      const palm = this.palmEls[d.playerId];
      if (palm) palm.classList.add('down');
      Sound.hand();
      if (this.meta.players[d.playerId].human) {
        $('#syncSub').textContent = t('sync.waiting');
        this.renderControls();
      }
    },

    onAllDown() {
      this.table.classList.add('synced');
      $('#syncText').textContent = t('sync.ready');
      $('#syncSub').textContent = '';
      Sound.sync();
      const c = FX.centerOf($('#piles'));
      FX.pulse(c.x, c.y, { power: 0.8, speed: 380 });
    },

    onPlaying(d) {
      this.table.classList.remove('syncing', 'synced');
      for (const id in this.palmEls) {
        const p = this.palmEls[id];
        if (p.classList.contains('down')) p.className = 'palm lift';
      }
      setTimeout(() => { for (const id in this.palmEls) this.palmEls[id].className = 'palm'; }, 600);
      $('#vote').hidden = true;
      this.lastActivity = performance.now();
      this.giggled = {};
      this.allMoods('focus');
      this.renderHand(false);
      this.renderControls();
      if (d.reason !== 'resume') {
        Sound.go();
        this.message(t('sync.go'), '', 1400);
      }
      const e = this.engine;
      if (e.human && e.human.hand.length) {
        if (e.blind) this.coach('blind');
        else if (e.piles.length > 1) this.coach('playDual');
        else {
          const c = e.urgent(e.human, e.piles[0].id);
          if (c) this.coach('play', { v: c.v, top: e.piles[0].ref });
        }
        if (this.settings.tells && e.level >= 2) this.coach('tells');
        if (e.level >= 3 && e.stars > 0 && e.lives <= 2) this.coach('star');
      }
    },

    onPlay(d) {
      const now = performance.now();
      this.lastActivity = now;
      this.giggled = {};
      const key = d.pileId + ':' + d.card.v;
      const src = this.fromRectFor(d.playerId, d.card.v);
      const human = this.meta.players[d.playerId].human;
      if (src.el && human) src.el.classList.add('leaving');
      this.inFlight.add(key);
      this.renderPiles();
      const target = this.pileEl(d.pileId);
      const rotTo = rotFor(d.card.v + Math.min(5, d.count - 1));
      this.fireLink(d.playerId);
      this.fly({ v: d.card.v, pile: d.pileId, from: src.rect, to: target, startBack: !human && !d.blind, endBack: d.blind, rotFrom: human ? 0 : 180, rotTo, duration: human ? 420 : 560 }).then(() => {
        this.inFlight.delete(key);
        this.renderPiles();
        const top = this.pileEl(d.pileId) && this.pileEl(d.pileId).querySelector('.card:last-of-type');
        if (top) top.classList.add('land');
        const c = FX.centerOf(this.pileEl(d.pileId) || $('#piles'));
        const color = d.pileId === 'down' ? ['#ff4d6d', '#ffd166', '#fff'] : ['#5ef2ff', '#b18cff', '#fff'];
        FX.burst(c.x, c.y, { count: 18, colors: color, speed: 220 });
        FX.pulse(c.x, c.y, { power: 0.6, hue: d.pileId === 'down' ? 340 : 180 });
      });
      Sound.card(d.card.v, d.pileId);
      if (human) {
        this.renderHand(false);
      } else {
        this.renderFans();
        this.seatAnim(d.playerId, 'played', 500);
        this.seatEls[d.playerId].classList.remove('lean');
      }
      this.sr(t('sr.play', { who: this.name(d.playerId), v: d.blind ? '?' : d.card.v }));
    },

    onPerfectSync(d) {
      const first = global.Store.unlock && !this.demo ? global.App.unlockBadge('aha') : false;
      setTimeout(() => {
        Sound.perfect();
        this.flash('cyan');

          els.forEach((el, i) => {
            const r = el.getBoundingClientRect();

            const v = Number(el.dataset.v);
            const to = this.trayRect(i);
            setTimeout(() => this.fly({ v, pile: el.dataset.pile, from: r, to, duration: 600 }).then(() => this.renderDiscard()), i * 120);
          });
          setTimeout(() => this.renderHand(false), cards.length * 120 + 650);
        }, 1000);
        return;
      }
      const seat = this.seatEls[pid];
      const rv = seat.querySelector('.reveal');
      rv.innerHTML = '';
      cards.forEach((c, i) => {
        const ce = cardEl(c.v, c.pile, { dual });
        ce.classList.add(cls);
        ce.style.animationDelay = i * 0.12 + 's';
        rv.appendChild(ce);
      });

      setTimeout(() => {
        Array.from(rv.children).forEach((ce, i) => {
          const r = ce.getBoundingClientRect();
          const to = this.trayRect(i);
          setTimeout(() => {
            ce.style.visibility = 'hidden';
            this.fly({ v: Number(ce.dataset.v), pile: ce.dataset.pile, from: r, to, duration: 600 }).then(() => this.renderDiscard());
          }, i * 120);
        });
        setTimeout(() => { rv.innerHTML = ''; }, cards.length * 120 + 650);

    onStarProposed(d) {

      $('#voteBtns').style.display = d.needsHuman ? '' : 'none';
      $('#voteTimer').parentElement.style.display = d.needsHuman ? '' : 'none';

        { transform: 'translate(0,0) scale(1.4) rotate(900deg)', opacity: 1, offset: 0.6 },

      this.renderStars();
      const by = {};

      });
      setTimeout(() => {
        this.renderLives();

        else { this.message(`✨ ${t('msg.revealOk')}`, 'good', 2000); this.allMoods('grin', 1800); Sound.perfect(); }
      }, 350 + d.results.length * step + 100);
    },

    onLevelDoneVisual() {
      const c = FX.centerOf($('#piles'));
      Sound.level();

    /* ---------- per-frame ---------- */
    frame(now) {
      const e = this.engine;
      if (!e) return;
      if (e.phase === 'sync') {
        const down = e.players.filter((p) => p.handDown).length;
        let pct = (down / e.players.length) * 55;
        if (e.allDownAt != null) pct = 55 + Math.min(1, (now - e.allDownAt) / global.Mind.TIMING.syncHold) * 45;
        $('#syncRing').style.setProperty('--p', pct.toFixed(1));
      }
      let tension = 0;
      if (e.phase === 'playing') {
        const silence = now - this.lastActivity;
        tension = Math.max(0, Math.min(1, (silence - 1500) / 14000));
        for (const p of e.players) {
          if (p.human) continue;
          const seat = this.seatEls[p.id];
          if (!seat) continue;
          const m = this.meta.players[p.id];
          const lean = this.settings.tells && !m.look.purist && e.tension(p, now) > 0.6;
          if (lean !== seat.classList.contains('lean')) {
            seat.classList.toggle('lean', lean);
            const a = seat.querySelector('.avatar');
            if (!a._t) a.className = 'avatar mood-' + (lean ? 'tense' : 'focus');
          }
          if (silence > 4500 && !this.giggled[p.id] && m.look.giggly && Math.random() < m.look.giggly * 0.004) {
            this.giggled[p.id] = true;
            this.bubble(p.id, '🤭', 1300);
            this.seatAnim(p.id, 'giggle', 1100);
            Sound.giggle();
          }
        }
        if (this.settings.heart && silence > 2500) {
          const interval = 1150 - 480 * tension;
          if (now - this.lastBeat > interval) { this.lastBeat = now; Sound.heartbeat(tension); }
        }
      } else {
        for (const id in this.seatEls) this.seatEls[id].classList.remove('lean');
      }
      if (e.phase === 'starVote' && this.voteStarted) {
        const left = Math.max(0, 1 - (now - this.voteStarted) / global.Mind.TIMING.voteTimeout);
        $('#voteTimer').style.transform = `scaleX(${left})`;
      }
      this.tension += ((tension || 0) - (this.tension || 0)) * 0.05;
      document.documentElement.style.setProperty('--tension', (this.tension || 0).toFixed(3));
      FX.tension = (this.tension || 0) * 0.85;
    },

    unmount() {
      this.engine = null;
      document.documentElement.style.setProperty('--tension', '0');
      FX.tension = 0;
      $('#coach').hidden = true;
      $('#vote').hidden = true;
      document.querySelectorAll('.card.flying, .shuriken-fly').forEach((x) => x.remove());
    },
  };

  global.UI = UI;
  global.MindView = { avatarSVG, cardEl, shade };
})(window);
